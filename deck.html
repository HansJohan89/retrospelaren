<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BLAUPUNKT · Stream Controller</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700&family=Bebas+Neue&family=Inter:wght@500;700&family=JetBrains+Mono:wght@500;700&family=Limelight&family=Special+Elite&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#121316; --panel:#1b1d21; --panel2:#23262b; --panel3:#2b2f35; --line:#30343b; --line2:#3d424a;
  --tx:#e8e9ec; --mut:#8e939c; --dim:#5d626b; --acc:#4c8dff; --acc-d:#2f6fe0; --ok:#30d158; --warn:#ffb020; --bad:#ff5a52;
  --r:8px;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:13px/1.4 "Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;overflow:hidden;
  -webkit-font-smoothing:antialiased;user-select:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.ic{width:18px;height:18px;flex:none}
#app{display:grid;grid-template-rows:52px minmax(0,1fr) auto;height:100dvh}

/* ---------- överkanten ---------- */
#top{display:flex;align-items:center;gap:10px;padding:0 14px;background:var(--panel);border-bottom:1px solid var(--line);min-width:0}
.brand{display:flex;align-items:center;gap:8px;color:var(--tx);text-decoration:none;font-weight:700;letter-spacing:.12em;font-size:12px;white-space:nowrap}
.brand .ic{color:var(--mut)}
.brand small{font-weight:500;letter-spacing:.04em;color:var(--mut)}
.vsep{width:1px;height:24px;background:var(--line);flex:none}
.tbtn{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 10px;border-radius:var(--r);border:1px solid var(--line);background:var(--panel2);white-space:nowrap}
.tbtn:hover{border-color:var(--line2);background:var(--panel3)}
.tbtn:disabled{opacity:.35;cursor:default}
.tbtn.icon{width:32px;padding:0;justify-content:center}
.tbtn .caret{color:var(--mut);font-size:10px;margin-left:2px}
#profileBtn{max-width:200px}
#profileBtn b{overflow:hidden;text-overflow:ellipsis;font-weight:600}
#pageTabs{display:flex;align-items:center;gap:4px;min-width:0;overflow-x:auto;scrollbar-width:none}
#pageTabs::-webkit-scrollbar{display:none}
.ptab{height:32px;min-width:34px;padding:0 11px;border-radius:var(--r);border:1px solid transparent;background:transparent;color:var(--mut);white-space:nowrap;font-weight:600}
.ptab:hover{background:var(--panel2);color:var(--tx)}
.ptab.on{background:var(--panel3);border-color:var(--line2);color:var(--tx)}
.ptab.live::after{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--ok);margin-left:6px;vertical-align:1px}
.ptab.add{color:var(--mut);font-size:16px;padding:0 9px}
.grow{flex:1}
.seg{display:inline-flex;padding:3px;border-radius:10px;background:#101114;border:1px solid var(--line)}
.seg button{height:26px;padding:0 12px;border:0;border-radius:7px;background:transparent;color:var(--mut);font-weight:600;white-space:nowrap}
.seg button.on{background:var(--acc);color:#fff}
.chip{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:13px;background:#101114;border:1px solid var(--line);color:var(--mut);font-size:12px;white-space:nowrap;cursor:pointer}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--dim)}
.chip.ok i{background:var(--ok);box-shadow:0 0 6px var(--ok)}
.chip.half i{background:var(--warn)}
#saveState{font-size:12px;color:var(--mut);min-width:64px;text-align:right;white-space:nowrap}
#saveState.err{color:var(--bad)}

/* ---------- mitten ---------- */
#body{display:grid;grid-template-columns:minmax(0,1fr) 316px;min-height:0}
#stage{position:relative;display:flex;flex-direction:column;min-width:0;min-height:0;
  background:radial-gradient(900px 480px at 50% 40%,#1b1e24 0,#121316 70%)}
#crumb{display:flex;align-items:center;gap:6px;height:38px;padding:0 16px;color:var(--mut);font-size:12.5px;flex:none}
#crumb button{background:none;border:0;color:var(--mut);padding:3px 6px;border-radius:5px;display:inline-flex;align-items:center;gap:4px}
#crumb button:hover{background:var(--panel2);color:var(--tx)}
#crumb b{color:var(--tx);font-weight:600}
#crumb .sp{flex:1}
#crumb label{display:inline-flex;align-items:center;gap:5px;cursor:pointer}
#deviceWrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
#sensors{flex:none;display:flex;align-items:center;justify-content:center;gap:10px;padding:2px 12px 8px;color:var(--mut);font-size:12px;flex-wrap:wrap}
#sensors .sLab{display:inline-flex;align-items:center;gap:6px;color:var(--tx);font-weight:600}
#sensors .sLab i{width:8px;height:8px;border-radius:50%;background:var(--dim)}
#sensors .sLab i.open{background:var(--ok)}
.sensChip{display:inline-flex;align-items:center;gap:7px;height:30px;padding:0 11px;border-radius:15px;background:var(--panel2);border:1px solid var(--line);color:var(--tx);cursor:pointer;max-width:260px}
.sensChip:hover{border-color:var(--line2);background:var(--panel3)}
.sensChip.sel{border-color:var(--acc);box-shadow:0 0 0 2px rgba(76,141,255,.35)}
.sensChip.dragover{border-color:var(--acc);background:var(--acc-d)}
.sensChip.unset{color:var(--dim);border-style:dashed}
.sensChip small{color:var(--mut)}
.sensChip b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.scWrap{display:grid;grid-template-columns:190px minmax(0,1fr);gap:0;height:min(640px,72vh)}
.scList{border-right:1px solid var(--line);padding:10px;overflow:auto}
.scList button{display:flex;align-items:center;gap:7px;width:100%;text-align:left;padding:7px 9px;border-radius:8px;border:1px solid transparent;background:none;color:var(--tx);margin-bottom:3px}
.scList button:hover{background:var(--panel2)}
.scList button.on{background:var(--panel3);border-color:var(--line2)}
.scList button span.nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.scEd{padding:14px 18px;overflow:auto}
.scEd h4{margin:16px 0 8px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mut)}
.scRoom{display:flex;align-items:center;gap:8px;margin:10px 0 4px;font-weight:600}
.scRoom .lnk{font-weight:400}
.lampRow{display:grid;grid-template-columns:22px minmax(110px,1.3fr) 62px minmax(90px,1fr) 92px minmax(90px,1fr) 30px;align-items:center;gap:8px;padding:4px 6px;border-radius:8px}
.lampRow:hover{background:var(--panel2)}
.lampRow.off>*:not(:first-child):not(.nm){opacity:.35;pointer-events:none}
.lampRow .try{width:28px;height:26px;display:inline-flex;align-items:center;justify-content:center;border-radius:7px;border:1px solid var(--line);background:var(--panel2);color:var(--mut)}
.lampRow .try:hover{color:#fff;border-color:var(--acc);background:var(--acc-d)}
.lampRow .nm{min-width:0}.lampRow .nm b{display:block;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lampRow .nm small{color:var(--dim);font-size:11px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lampRow input[type=range]{width:100%;min-width:0}
.inCard{border:1px solid var(--line);border-radius:12px;background:var(--panel2);padding:12px 14px;margin-bottom:12px}
.inCard .hd{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.inCard .hd b{font-size:14px}.inCard .hd small{color:var(--mut)}
.inCard .hd .bat{margin-left:auto;color:var(--mut);font-size:12px;white-space:nowrap}
.inCard .hd .bat.low{color:var(--bad)}
.evRow{display:grid;grid-template-columns:150px minmax(0,1fr);gap:6px 10px;align-items:start;padding:6px 0;border-top:1px solid var(--line)}
.evRow>label{color:var(--mut);font-size:12px;padding-top:7px}
.evRow .sub{margin-top:8px;padding:8px 10px;border-radius:8px;background:var(--panel)}
.spk{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:14px;border:1px solid var(--line);background:var(--panel2);cursor:pointer}
.spk.on{border-color:var(--acc);background:rgba(76,141,255,.16)}
.fRow.top{align-items:start}
.onoff{height:24px;border-radius:12px;border:1px solid var(--line2);background:#101114;color:var(--mut);font-size:11px;padding:0 8px}
.onoff.on{background:#3a3210;border-color:#ffd60a;color:#ffd60a}
#stageHint{height:30px;flex:none;text-align:center;color:var(--dim);font-size:12px;padding:0 12px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}

/* ---------- enheten (uppifrån, som den står på bordet) ---------- */
#device{position:relative;width:660px;height:422px;flex:none;border-radius:30px;transform-origin:center;
  background:linear-gradient(165deg,#2b2d32 0,#1d1f23 38%,#141518 100%);
  box-shadow:0 0 0 1px #000,inset 0 1px 0 rgba(255,255,255,.09),inset 0 -2px 6px rgba(0,0,0,.6),0 30px 60px rgba(0,0,0,.55),0 8px 18px rgba(0,0,0,.5)}
#device::before{content:"";position:absolute;inset:10px;border-radius:22px;border:1px solid rgba(255,255,255,.035);pointer-events:none}
.dvBrand{position:absolute;left:40px;width:320px;top:22px;text-align:center;font:700 9.5px/1 "Segoe UI",Arial,sans-serif;letter-spacing:.42em;color:#5a5e66}
.key{position:absolute;width:96px;height:96px;border-radius:13px;background:#050506;overflow:hidden;
  box-shadow:0 0 0 2px #0a0a0b,0 0 0 3px #34373d,0 4px 8px rgba(0,0,0,.6);cursor:pointer;transition:transform .07s ease,filter .07s ease}
.key canvas{width:100%;height:100%;display:block;border-radius:11px}
.key .glass{position:absolute;inset:0;border-radius:12px;pointer-events:none;
  background:linear-gradient(180deg,rgba(255,255,255,.10) 0,rgba(255,255,255,.02) 26%,rgba(255,255,255,0) 50%);box-shadow:inset 0 0 0 1px rgba(255,255,255,.05)}
.key.down{transform:translateY(2px) scale(.965);filter:brightness(1.25)}
.key.empty canvas{opacity:0}
.mode-edit .key.empty{background:#0c0d0f;box-shadow:0 0 0 2px #0a0a0b,0 0 0 3px #2a2d33}
.mode-edit .key.empty::after{content:"+";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#3b3f47;font-size:26px;font-weight:300}
.sbtn{position:absolute;width:42px;height:42px;border-radius:50%;cursor:pointer;
  background:radial-gradient(circle at 50% 35%,#3a3d43 0,#232529 55%,#17181b 100%);
  box-shadow:0 0 0 2px #0b0b0c,0 0 0 3px #33363c,0 3px 6px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.12);transition:transform .07s ease}
.sbtn.down{transform:translateY(2px) scale(.94);filter:brightness(1.3)}
.sbtn.unset{opacity:.55}
.cap{position:absolute;font:600 10px/1.1 "Segoe UI",Arial,sans-serif;color:#7d828b;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
.hideCaps .cap{display:none}
.knob{position:absolute;border-radius:50%;cursor:pointer;touch-action:none;
  background:radial-gradient(circle at 50% 30%,#2c2e33 0,#191a1d 70%);
  box-shadow:0 0 0 2px #0a0a0b,0 0 0 3px #32353b,0 10px 18px rgba(0,0,0,.6)}
.knob .dial{position:absolute;inset:9%;border-radius:50%;
  background:conic-gradient(from 0deg,#3b3e44,#1d1e22 12%,#34373d 25%,#1b1c20 37%,#3b3e44 50%,#1d1e22 62%,#34373d 75%,#1b1c20 87%,#3b3e44);
  box-shadow:inset 0 2px 3px rgba(255,255,255,.14),inset 0 -6px 12px rgba(0,0,0,.6),0 3px 8px rgba(0,0,0,.6)}
.knob .top{position:absolute;inset:21%;border-radius:50%;background:radial-gradient(circle at 50% 30%,#34363c 0,#1e2024 75%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 1px 2px rgba(0,0,0,.6)}
.knob .tick{position:absolute;left:50%;top:13%;width:3px;height:13%;margin-left:-1.5px;border-radius:2px;background:#cfd3da;box-shadow:0 0 5px rgba(255,255,255,.35)}
.knob.down .dial{transform:scale(.96)}
.knob .rotwrap{position:absolute;inset:0;border-radius:50%;transition:transform .09s linear}
.knob .zones{position:absolute;inset:-9px;border-radius:50%;pointer-events:none;display:none}
.knob .zones span{position:absolute;display:flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;background:#101114;border:1px solid var(--line2);color:var(--dim);font-size:12px;line-height:1}
.knob .zones span.set{color:#fff;border-color:var(--acc);background:var(--acc-d)}
.knob .zones .zl{left:-7px;top:50%;margin-top:-11px}
.knob .zones .zr{right:-7px;top:50%;margin-top:-11px}
.knob .zones .zp{left:50%;bottom:-8px;margin-left:-11px}
.mode-edit .knob .zones{display:block}
.knob .zones span.hot{background:var(--ok);border-color:var(--ok);color:#04130a}
.rotBtn{position:absolute;width:26px;height:26px;border-radius:50%;border:1px solid var(--line2);background:#101114;color:var(--mut);display:none;align-items:center;justify-content:center;padding:0}
.rotBtn:hover{color:#fff;border-color:var(--acc)}
.mode-use .rotBtn{display:flex}
.sel{outline:2px solid var(--acc);outline-offset:4px}
.key.sel{outline-offset:5px}
.dragover{outline:2px solid var(--ok)!important;outline-offset:5px}
.mode-use #device .key,.mode-use #device .sbtn{cursor:pointer}
#device.asleep .key canvas{filter:brightness(0)}
.flash{animation:flash .28s ease}
@keyframes flash{0%{filter:brightness(1.9)}100%{filter:none}}

/* ---------- sidopanelen: åtgärder (redigera) / händelser (använd) ---------- */
#side{background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
#sideHead{padding:10px 12px 8px;border-bottom:1px solid var(--line);flex:none}
#sideHead h3{margin:0 0 8px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);font-weight:700}
.search{position:relative}
.search input{width:100%;height:30px;padding:0 10px 0 30px;border-radius:var(--r);border:1px solid var(--line);background:#101114;outline:none;user-select:text}
.search input:focus{border-color:var(--acc)}
.search .ic{position:absolute;left:8px;top:6px;color:var(--dim)}
#lib,#log{flex:1;overflow:auto;min-height:0;padding:4px 0 14px}
.libCat{padding:10px 12px 4px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);font-weight:700;display:flex;align-items:center;gap:6px;cursor:pointer}
.libCat .car{font-size:9px;color:var(--dim);transition:transform .12s}
.libCat.shut .car{transform:rotate(-90deg)}
.libItem{display:flex;align-items:center;gap:10px;height:34px;margin:1px 6px;padding:0 8px;border-radius:7px;cursor:grab}
.libItem:hover{background:var(--panel3)}
.libItem:active{cursor:grabbing}
.libItem .sw{width:24px;height:24px;border-radius:6px;background:#111216;display:flex;align-items:center;justify-content:center;flex:none;box-shadow:inset 0 0 0 1px var(--line)}
.libItem .sw .ic{width:16px;height:16px}
.libItem span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.libItem em{font-style:normal;font-size:10.5px;color:var(--dim)}
.logRow{padding:5px 12px;border-bottom:1px solid #202328;font-size:12px;display:grid;grid-template-columns:54px 1fr;gap:2px 8px}
.logRow time{color:var(--dim);font-variant-numeric:tabular-nums}
.logRow .w{color:var(--tx)}
.logRow .w em{font-style:normal;color:var(--acc);font-weight:600}
.logRow .w em.hw{color:var(--ok)}
.logRow code{grid-column:2;color:var(--mut);font:11px/1.35 "JetBrains Mono",Consolas,monospace;word-break:break-all;user-select:text}
.empty{padding:22px 16px;color:var(--dim);text-align:center;line-height:1.5}

/* ---------- inspektorn ---------- */
#inspector{background:var(--panel);border-top:1px solid var(--line);height:292px;min-height:0;overflow:hidden;display:flex}
.mode-use #inspector{display:none}
.insEmpty{margin:auto;color:var(--dim);text-align:center;line-height:1.6;max-width:520px;padding:16px}
.insCol{padding:12px 14px;min-width:0;overflow:auto;border-right:1px solid var(--line)}
.insCol:last-child{border-right:0}
.insCol h4,.slotCard h4,.encSide h4{margin:0 0 9px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);font-weight:700;display:flex;align-items:center;gap:8px}
.insCol h4 .sp,.slotCard h4 .sp{flex:1}
.insCol h4 button,.slotCard h4 button{font-size:11px;letter-spacing:0;text-transform:none;font-weight:500}
.colPrev{flex:0 0 178px;display:flex;flex-direction:column;align-items:center;gap:9px}
.colLook{flex:1 1 430px}
.colAct{flex:1 1 400px}
.bigPrev{width:118px;height:118px;border-radius:15px;box-shadow:0 0 0 2px #0a0a0b,0 0 0 3px #34373d,0 6px 14px rgba(0,0,0,.5);background:#050506}
.stTabs{display:flex;gap:4px}
.stTabs button{height:24px;padding:0 9px;border-radius:6px;border:1px solid var(--line);background:#101114;color:var(--mut);font-size:12px}
.stTabs button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.lnk{background:none;border:0;color:var(--acc);padding:0;font-size:12px}
.lnk:hover{text-decoration:underline}
.lnk.mut{color:var(--mut)}
.fRow{display:grid;grid-template-columns:104px minmax(0,1fr);align-items:center;gap:6px 10px;margin-bottom:7px}
.fRow>label{color:var(--mut);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fRow .ctl{display:flex;align-items:center;gap:6px;min-width:0;flex-wrap:wrap}
.fRow.top{align-items:start}
.fRow.top>label{padding-top:6px}
.in,select.in,textarea.in{height:28px;padding:0 8px;border-radius:6px;border:1px solid var(--line);background:#101114;outline:none;min-width:0;user-select:text}
textarea.in{height:auto;padding:5px 8px;resize:vertical;width:100%;line-height:1.3;font-family:inherit}
.in:focus{border-color:var(--acc)}
.in.w{flex:1;width:100%}
.in.n{width:68px}
select.in{padding-right:4px}
input[type=range]{flex:1;min-width:60px;accent-color:var(--acc);height:20px}
input[type=color]{width:30px;height:28px;padding:0;border:1px solid var(--line);border-radius:6px;background:#101114;cursor:pointer}
input[type=checkbox]{accent-color:var(--acc);width:15px;height:15px;margin:0}
.val{min-width:40px;text-align:right;color:var(--mut);font-variant-numeric:tabular-nums;font-size:12px}
.tg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:#101114}
.tg button{width:28px;height:26px;border:0;background:transparent;color:var(--mut);display:flex;align-items:center;justify-content:center;padding:0;font-weight:700}
.tg button+button{border-left:1px solid var(--line)}
.tg button.on{background:var(--panel3);color:#fff}
.tg.txt button{width:auto;padding:0 9px;font-weight:500;font-size:12px}
.sbtnS{height:28px;padding:0 10px;border-radius:6px;border:1px solid var(--line);background:var(--panel2);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.sbtnS:hover{border-color:var(--line2);background:var(--panel3)}
.sbtnS.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.sbtnS.danger:hover{border-color:var(--bad);color:var(--bad)}
.iconBtn{width:44px;height:44px;border-radius:9px;border:1px solid var(--line);background:#101114;display:flex;align-items:center;justify-content:center;padding:0;overflow:hidden}
.iconBtn:hover{border-color:var(--acc)}
.iconBtn .ic{width:26px;height:26px}
.iconBtn img{width:100%;height:100%;object-fit:cover}
.swatches{display:flex;gap:4px;flex-wrap:wrap}
.swatches button{width:18px;height:18px;border-radius:50%;border:1px solid rgba(255,255,255,.18);padding:0}
.actHead{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.actHead .sw{width:30px;height:30px;border-radius:8px;background:#111216;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 0 0 1px var(--line)}
.actHead b{font-size:14px}
.actHead small{display:block;color:var(--mut)}
.note{color:var(--mut);font-size:12px;line-height:1.45;margin:6px 0}
.note code{background:#101114;border:1px solid var(--line);border-radius:4px;padding:0 4px;font:11px "JetBrains Mono",Consolas,monospace;user-select:text;word-break:break-all}
.slotCard{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#17191c;margin-bottom:0;min-height:100%}
.slotCard.dragover{outline-offset:-2px!important}
.slotCard h4 .zi{display:inline-flex;width:20px;height:20px;border-radius:50%;background:#101114;border:1px solid var(--line2);align-items:center;justify-content:center;font-size:12px;color:var(--tx);letter-spacing:0}
.encCols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;flex:1;padding:12px 14px;overflow:auto;min-width:0}

<script id="core">
"use strict";
/* =====================================================================================
   KÄRNAN - datamodell, kommandon och körmotor. Ingen DOM här: samma regler finns i
   hubben på Pi:n (hub/deck_engine.py) och de två jämförs i test/crosscheck. Ändrar du
   något här ska det ändras där också.

   Enheten (SOOMFON Stream Controller SE):
     6 LCD-knappar   key 0-2 övre raden, 3-5 nedre raden (vänster till höger)
     3 små knappar   btn 0-2 under LCD-knapparna (utan skärm)
     3 rattar        enc 0 = stora ratten, 1 = lilla vänstra, 2 = lilla högra
                     varje ratt har tre platser: ccw (vrid vänster), cw (vrid höger), press

   deck = { v, device:{brightness, sleepMin, map}, profiles:[profile], _faces }
   profile = { id, name, pages:[page], folders:{ fid:{ keys:[6] } } }
   page    = { id, name, keys:[6], btns:[3], encs:[3 x {ccw,cw,press}] }
   ctl     = { id, states:[ {a:action, look}, ... ] }   // 1 läge, eller 2 som växlar vid tryck
   nav     = { p:profilId, pg:sidindex, stack:[fid,...] }   // delas med den fysiska enheten
   ===================================================================================== */
const DeckCore = (() => {
  const N_KEYS = 6, N_BTNS = 3, N_ENCS = 3;
  const HOLD_MS = 550;        // håll in Tillbaka så här länge = hoppa ända upp
  const ROT_WINDOW_MS = 60;   // snabba rattsteg inom det här fönstret slås ihop till ett kommando
  const uid = () => Math.random().toString(36).slice(2, 10);

  const newCtl = (a, look) => ({ id: uid(), states: [{ a, look: look || {} }] });
  const newEnc = () => ({ ccw: null, cw: null, press: null });
  const newPage = name => ({ id: uid(), name: name || "", keys: Array(N_KEYS).fill(null), btns: Array(N_BTNS).fill(null),
                             encs: [newEnc(), newEnc(), newEnc()] });
  const newProfile = name => ({ id: uid(), name: name || "Profil", pages: [newPage()], folders: {} });

  // ---- rattförval: fyller vrid vänster / vrid höger / tryck i ett svep ----
  const DIALS = {
    spvol:   { name: "Spotify-volym",    ccw: () => ({ t:"sp", op:"vol-rel", value:-5 }),                  cw: () => ({ t:"sp", op:"vol-rel", value:5 }),                   press: () => ({ t:"sp", op:"toggle" }) },
    sptrack: { name: "Spotify-spår",     ccw: () => ({ t:"sp", op:"prev" }),                               cw: () => ({ t:"sp", op:"next" }),                               press: () => ({ t:"sp", op:"toggle" }) },
    spseek:  { name: "Spotify, spola",   ccw: () => ({ t:"sp", op:"seek-rel", value:-10 }),                cw: () => ({ t:"sp", op:"seek-rel", value:10 }),                 press: () => ({ t:"sp", op:"toggle" }) },
    volume:  { name: "Sonos-volym",            ccw: r => ({ t:"sonos", room:r.room, op:"vol-rel", value:-3 }),  cw: r => ({ t:"sonos", room:r.room, op:"vol-rel", value:3 }),   press: r => ({ t:"sonos", room:r.room, op:"mute" }) },
    track:   { name: "Sonos-spår",             ccw: r => ({ t:"sonos", room:r.room, op:"prev" }),               cw: r => ({ t:"sonos", room:r.room, op:"next" }),               press: r => ({ t:"sonos", room:r.room, op:"toggle" }) },
    dim:     { name: "Ljusstyrka",       ccw: r => ({ t:"light", group:r.group, op:"dim-rel", value:-8 }), cw: r => ({ t:"light", group:r.group, op:"dim-rel", value:8 }),  press: r => ({ t:"light", group:r.group, op:"toggle" }) },
    temp:    { name: "Färgtemperatur",   ccw: r => ({ t:"light", group:r.group, op:"temp-rel", value:-8 }), cw: r => ({ t:"light", group:r.group, op:"temp-rel", value:8 }), press: r => ({ t:"light", group:r.group, op:"temp", value:35 }) },
    hue:     { name: "Färghjul",         ccw: r => ({ t:"light", group:r.group, op:"hue-rel", value:-15 }), cw: r => ({ t:"light", group:r.group, op:"hue-rel", value:15 }), press: r => ({ t:"light", group:r.group, op:"temp", value:35 }) },
    viz:     { name: "Kanal",            ccw: () => ({ t:"viz", n:"prev" }),                               cw: () => ({ t:"viz", n:"next" }),                               press: () => ({ t:"palette", p:"next" }) },
    pages:   { name: "Bläddra sidor",    ccw: () => ({ t:"pagenav", op:"prev" }),                          cw: () => ({ t:"pagenav", op:"next" }),                          press: () => ({ t:"home" }) },
    deckbri: { name: "Knapparnas ljus",  ccw: () => ({ t:"deckdev", op:"brightness-rel", value:-10 }),     cw: () => ({ t:"deckdev", op:"brightness-rel", value:10 }),      press: () => ({ t:"deckdev", op:"sleep-toggle" }) }
  };
  function applyDial(enc, dialId, ctx){
    const d = DIALS[dialId]; if (!d) return;
    const r = Object.assign({ room: "Vardagsrum", group: "vardagsrum" }, ctx || {});
    enc.ccw = newCtl(d.ccw(r)); enc.cw = newCtl(d.cw(r)); enc.press = newCtl(d.press(r));
    enc.name = d.name;
  }

  function defaultDeck(){
    const prof = newProfile("Vardagsrum");
    const pg = prof.pages[0]; pg.name = "Hem";
    const G = "vardagsrum", R = "Vardagsrum";
    const scenes = uid(), screen = uid();
    pg.keys[0] = newCtl({ t:"sp", op:"toggle" });
    pg.keys[1] = newCtl({ t:"sp", op:"prev" });
    pg.keys[2] = newCtl({ t:"sp", op:"next" });
    pg.keys[3] = { id: uid(), states: [ { a:{ t:"light", group:G, op:"on" }, look:{} }, { a:{ t:"light", group:G, op:"off" }, look:{} } ] };
    pg.keys[4] = newCtl({ t:"folder", fid: scenes }, { t:{ text:"Ljus" }, i:{ kind:"lib", id:"sparkles" } });
    pg.keys[5] = newCtl({ t:"folder", fid: screen }, { t:{ text:"Skärm" }, i:{ kind:"lib", id:"tv" } });
    prof.folders[scenes] = { keys: [
      newCtl({ t:"light", group:G, op:"dim", value:100 }, { t:{ text:"Fullt" } }),
      newCtl({ t:"light", group:G, op:"dim", value:40 },  { t:{ text:"Dämpat" }, i:{ kind:"lib", id:"sun-dim" } }),
      newCtl({ t:"light", group:G, op:"temp", value:10 }, { t:{ text:"Varmt" }, i:{ kind:"lib", id:"flame" } }),
      newCtl({ t:"light", group:G, op:"temp", value:80 }, { t:{ text:"Kallt" }, i:{ kind:"lib", id:"snow" } }),
      newCtl({ t:"light", group:G, op:"scene", value:"" }),
      newCtl({ t:"light", group:G, op:"off" }) ] };
    prof.folders[screen] = { keys: [
      newCtl({ t:"bp", c:"open" }), newCtl({ t:"bp", c:"close" }), newCtl({ t:"viz", n:"next" }),
      newCtl({ t:"palette", p:"next" }), newCtl({ t:"page", p:"wx" }), newCtl({ t:"page", p:"next" }) ] };
    pg.btns[0] = newCtl({ t:"pagenav", op:"goto", page:1 });
    pg.btns[1] = newCtl({ t:"pagenav", op:"goto", page:2 });
    pg.btns[2] = newCtl({ t:"back" });
    applyDial(pg.encs[0], "volume", { room:R });
    applyDial(pg.encs[1], "dim", { group:G });
    applyDial(pg.encs[2], "temp", { group:G });
    const p2 = newPage("Sida 2");
    p2.btns = JSON.parse(JSON.stringify(pg.btns)); p2.btns.forEach(b => { if (b) b.id = uid(); });
    p2.encs = JSON.parse(JSON.stringify(pg.encs)); p2.encs.forEach(e => ["ccw","cw","press"].forEach(s => { if (e[s]) e[s].id = uid(); }));
    prof.pages.push(p2);
    return { v: 2, device: { brightness: 70, sleepMin: 0, map: null }, profiles: [prof] };
  }

  // ---- gamla 4x2-macropaden (S.macropad / S.mpFolders i state.json) -> nya formatet ----
  function migrateOld(deck, macropad, mpFolders){
    const conv = b => {
      if (!b) return null;
      if (b.kind === "cmd") return { t:"bp", c: b.v1 || "open" };
      if (b.kind === "viz") return { t:"viz", n: String(b.v1 || "1") };
      if (b.kind === "palette") return { t:"palette", p: b.v1 || "svartvit" };
      if (b.kind === "light"){
        const op = b.v2 || "on";
        const value = (op === "dim" || op === "temp") ? (+b.v3 || 0) : op === "color" ? String(b.v3 || "ffcc88").replace("#", "") : (b.v3 || "");
        return { t:"light", group: b.v1 || "", op, value };
      }
      return null;
    };
    const prof = deck.profiles[0];
    const slot = b => {
      if (!b) return null;
      const look = b.label ? { t:{ text: b.label } } : {};
      if (b.kind === "folder"){
        const fid = uid(), src = (mpFolders && mpFolders[b.folderId]) || [];
        prof.folders[fid] = { keys: Array.from({ length: N_KEYS }, (_, i) => slot(src[i])) };
        return newCtl({ t:"folder", fid }, look);
      }
      if (b.kind === "multi"){
        const steps = (b.steps || []).map(st => ({ a: conv(st), delay: Math.max(0, +b.delayMs || 150) })).filter(s => s.a);
        return newCtl({ t:"multi", steps }, look);
      }
      if (Array.isArray(b.states) && b.states.length === 2){
        const sts = b.states.map(s => ({ a: conv(s), look: (s.label || b.label) ? { t:{ text: s.label || b.label } } : {} })).filter(s => s.a);
        if (sts.length === 2) return { id: uid(), states: sts };
      }
      const a = conv(b);
      return a ? newCtl(a, look) : null;
    };
    const all = (macropad || []).map(slot);
    if (!all.some(Boolean)) return false;
    const base = prof.pages[0];
    for (let off = 0; off < all.length; off += N_KEYS){
      const chunk = all.slice(off, off + N_KEYS);
      if (!chunk.some(Boolean)) continue;
      const pg = newPage(off ? "Macropad " + (off / N_KEYS + 1) : "Macropad");
      chunk.forEach((c, i) => { pg.keys[i] = c; });
      pg.btns = JSON.parse(JSON.stringify(base.btns)); pg.btns.forEach(b => { if (b) b.id = uid(); });
      pg.encs = JSON.parse(JSON.stringify(base.encs)); pg.encs.forEach(e => ["ccw","cw","press"].forEach(s => { if (e[s]) e[s].id = uid(); }));
      prof.pages.push(pg);
    }
    return true;
  }

  // ---- kommandosträngar: det som faktiskt skickas (till /api/send, eller körs direkt av hubben) ----
  const REL_OPS = { light: ["dim-rel", "temp-rel", "hue-rel"], sonos: ["vol-rel"], sp: ["vol-rel", "seek-rel"], deckdev: ["brightness-rel"], z2m: ["brightness-step"] };
  const isRel = a => !!(a && REL_OPS[a.t] && REL_OPS[a.t].includes(a.op));
  const num = (v, d) => { const n = Number(v); return Number.isFinite(n) ? n : d; };
  function toCmd(a, mult){
    if (!a) return "";
    const k = mult || 1;
    switch (a.t){
      case "bp": return a.c || "";
      case "viz": return "viz:" + (a.n || "1");
      case "palette": return "palette:" + (a.p || "svartvit");
      case "page": return "page:" + (a.p || "next");
      case "light": {
        const op = a.op || "on"; let value = null;
        if (op === "dim") value = Math.max(1, Math.min(100, Math.round(num(a.value, 100))));
        else if (op === "temp") value = Math.max(0, Math.min(100, Math.round(num(a.value, 50))));
        else if (op === "dim-rel" || op === "temp-rel" || op === "hue-rel") value = Math.round(num(a.value, 0)) * k;
        else if (op === "color") value = String(a.value || "ffcc88").replace("#", "").toLowerCase();
        else if (op === "scene") value = String(a.value || "");
        return "light:" + JSON.stringify({ group: a.group || "", action: op, value });
      }
      case "scene": return a.id ? "scene:" + String(a.id) : "";
      case "sonos": {
        const op = a.op || "toggle", room = a.room || "";
        if (op === "vol") return "sonos-vol:" + JSON.stringify({ room, value: Math.max(0, Math.min(100, Math.round(num(a.value, 30)))) });
        if (["group", "group-toggle", "ungroup"].includes(op) && Array.isArray(a.rooms) && a.rooms.length){
          // ikryssade högtalare: den första som rum, resten som lista
          const rs = a.rooms.map(String);
          return "sonos:" + JSON.stringify({ room: rs[0], action: op, value: rs.slice(1) });
        }
        let value = null;
        if (op === "vol-rel") value = Math.round(num(a.value, 0)) * k;
        else if (["playlist", "fav", "group", "group-toggle"].includes(op)) value = String(a.value || "");
        return "sonos:" + JSON.stringify({ room, action: op, value });
      }
      case "sp": {
        const op = a.op || "toggle"; let value = null;
        if (op === "vol") value = Math.max(0, Math.min(100, Math.round(num(a.value, 30))));
        else if (op === "vol-rel" || op === "seek-rel") value = Math.round(num(a.value, 0)) * k;
        else if (op === "playlist" || op === "device") value = String(a.value || "");
        return "sp:" + JSON.stringify({ action: op, value, device: a.device || "" });
      }
      case "z2m": {
        const op = a.op || "toggle"; let p;
        if (op === "on") p = { state: "ON" }; else if (op === "off") p = { state: "OFF" }; else if (op === "toggle") p = { state: "TOGGLE" };
        else if (op === "brightness") p = { brightness: Math.max(0, Math.min(254, Math.round(num(a.value, 50) / 100 * 254))) };
        else if (op === "brightness-step") p = { brightness_step: Math.round(num(a.value, 0) / 100 * 254) * k };
        else if (op === "color_temp") p = { color_temp: Math.round(454 - Math.max(0, Math.min(100, num(a.value, 50))) / 100 * (454 - 250)) };
        else p = { state: "TOGGLE" };
        return "mqtt:" + JSON.stringify({ topic: "zigbee2mqtt/" + (a.dev || "") + "/set", payload: JSON.stringify(p) });
      }
      case "mqtt": return "mqtt:" + JSON.stringify({ topic: a.topic || "", payload: a.payload == null ? "" : String(a.payload) });
      case "http": return "http:" + JSON.stringify({ url: a.url || "", method: a.method || "GET", body: a.body || "" });
      case "sys": return "sys:" + JSON.stringify({ name: a.name || "" });
      case "deckdev": {
        const op = a.op || "brightness"; let value = null;
        if (op === "brightness") value = Math.max(0, Math.min(100, Math.round(num(a.value, 70))));
        else if (op === "brightness-rel") value = Math.round(num(a.value, 0)) * k;
        return "deck:" + JSON.stringify({ action: op, value });
      }
    }
    return "";
  }

  // ---- vy: vad som ligger på knapparna just nu ----
  function profileOf(deck, nav){ return deck.profiles.find(p => p.id === (nav && nav.p)) || deck.profiles[0]; }
  function ctlsOfPage(page){
    const out = [];
    (page.btns || []).forEach(c => { if (c) out.push(c); });
    (page.encs || []).forEach(e => ["ccw", "cw", "press"].forEach(s => { if (e && e[s]) out.push(e[s]); }));
    return out;
  }
  // Finns Tillbaka på en liten knapp eller ratt behåller mappen alla sex LCD-knappar.
  // Annars tar en fast Tillbaka-knapp plats 0 i mappen, som på en Stream Deck.
  function hasBackControl(page){
    return ctlsOfPage(page).some(c => c.states.some(s => s.a && (s.a.t === "back" || s.a.t === "home")));
  }
  function resolveView(deck, nav){
    const prof = profileOf(deck, nav);
    const pg = Math.max(0, Math.min(prof.pages.length - 1, (nav && nav.pg) | 0));
    const page = prof.pages[pg];
    const stack = ((nav && nav.stack) || []).filter(f => prof.folders[f]);
    let keys = page.keys, backKey = -1, folder = null;
    if (stack.length){
      folder = prof.folders[stack[stack.length - 1]];
      keys = folder.keys;
      if (!hasBackControl(page)) backKey = 0;
    }
    return { prof, pg, page, stack, keys, backKey, folder };
  }
  function normNav(deck, nav){
    const v = resolveView(deck, nav || {});
    return { p: v.prof.id, pg: v.pg, stack: v.stack.slice() };
  }
  const sameNav = (a, b) => !!a && !!b && a.p === b.p && a.pg === b.pg && JSON.stringify(a.stack || []) === JSON.stringify(b.stack || []);

  /* ---- körmotorn ----
     io = { send(cmd, action), navChanged(nav), stChanged(patch), now(), setTimeout(fn, ms) }
     input(kind, i, down)   kind "key" | "btn" | "encp"   (down = true/false)
     rotate(i, dir)         dir -1 (vänster) / +1 (höger), ett steg i taget                    */
  class Engine {
    constructor(getDeck, io){
      this.getDeck = getDeck; this.io = io;
      this.nav = null; this.st = {};
      this.downAt = {}; this.rot = {};
    }
    view(){ const d = this.getDeck(); this.nav = normNav(d, this.nav); return resolveView(d, this.nav); }
    ctlAt(kind, i){
      const v = this.view();
      if (kind === "key") return i === v.backKey ? { id: "__back", states: [{ a: { t: "back" } }] } : v.keys[i];
      if (kind === "btn") return v.page.btns[i];
      if (kind === "encp") return v.page.encs[i] && v.page.encs[i].press;
      return null;
    }
    stateOf(ctl){ return ctl && ctl.states.length > 1 ? ((this.st[ctl.id] | 0) % ctl.states.length) : 0; }
    input(kind, i, down){
      const ctl = this.ctlAt(kind, i); if (!ctl) return;
      const key = kind + i, a = ctl.states[this.stateOf(ctl)].a;
      const holdable = a && a.t === "back";
      if (down){
        this.downAt[key] = this.io.now();
        if (!holdable) this.runCtl(ctl);
      } else {
        const t0 = this.downAt[key]; delete this.downAt[key];
        if (holdable) this.exec(t0 != null && this.io.now() - t0 >= HOLD_MS ? { t: "home" } : a);
      }
    }
    runCtl(ctl){
      const idx = this.stateOf(ctl), a = ctl.states[idx].a;
      if (ctl.states.length > 1){
        const next = (idx + 1) % ctl.states.length;
        this.st[ctl.id] = next;
        this.io.stChanged({ [ctl.id]: next });
      }
      this.exec(a);
    }
    rotate(i, dir){
      const v = this.view(), enc = v.page.encs[i]; if (!enc) return;
      const ctl = dir < 0 ? enc.ccw : enc.cw; if (!ctl) return;
      const a = ctl.states[this.stateOf(ctl)].a;
      if (!isRel(a)){ this.runCtl(ctl); return; }
      // relativa steg (volym, ljusstyrka ...): samla snabba steg och skicka ett kommando
      const slot = this.rot[ctl.id];
      if (slot){ slot.n++; return; }
      this.rot[ctl.id] = { n: 1 };
      this.io.setTimeout(() => {
        const n = this.rot[ctl.id].n; delete this.rot[ctl.id];
        const cmd = toCmd(a, n);
        if (cmd) this.io.send(cmd, a);
      }, ROT_WINDOW_MS);
    }
    setNav(nav){ this.nav = normNav(this.getDeck(), nav); this.io.navChanged(this.nav); }
    exec(a){
      if (!a) return;
      const d = this.getDeck(), v = this.view(), nav = this.nav;
      switch (a.t){
        case "folder": if (v.prof.folders[a.fid]) this.setNav({ p: nav.p, pg: nav.pg, stack: nav.stack.concat([a.fid]) }); return;
        case "back": if (nav.stack.length) this.setNav({ p: nav.p, pg: nav.pg, stack: nav.stack.slice(0, -1) }); return;
        case "home": if (nav.stack.length) this.setNav({ p: nav.p, pg: nav.pg, stack: [] }); return;
        case "pagenav": {
          const n = v.prof.pages.length; let pg = nav.pg;
          if (a.op === "next") pg = (pg + 1) % n;
          else if (a.op === "prev") pg = (pg - 1 + n) % n;
          else pg = Math.max(0, Math.min(n - 1, (parseInt(a.page, 10) || 1) - 1));
          if (pg !== nav.pg || nav.stack.length) this.setNav({ p: nav.p, pg, stack: [] });
          return;
        }
        case "profile": {
          const idx = d.profiles.findIndex(p => p.id === nav.p);
          const target = a.pid && a.pid !== "next" ? d.profiles.find(p => p.id === a.pid) : d.profiles[(idx + 1) % d.profiles.length];
          if (target && target.id !== nav.p) this.setNav({ p: target.id, pg: 0, stack: [] });
          return;
        }
        case "multi": this.runMulti(a.steps || [], 0); return;
      }
      const cmd = toCmd(a);
      if (cmd) this.io.send(cmd, a);
    }
    runMulti(steps, i){
      if (i >= steps.length) return;
      const st = steps[i];
      if (st && st.a && st.a.t !== "multi") this.exec(st.a);
      if (i + 1 < steps.length) this.io.setTimeout(() => this.runMulti(steps, i + 1), Math.max(0, num(st && st.delay, 150)));
    }
  }

  // Alla kontroller i en profil (för ansiktsbilder, validering m.m.)
  function eachCtl(deck, fn){
    deck.profiles.forEach(prof => {
      prof.pages.forEach((page, pi) => {
        page.keys.forEach((c, i) => { if (c) fn(c, { prof, page, pi, kind: "key", i }); });
        page.btns.forEach((c, i) => { if (c) fn(c, { prof, page, pi, kind: "btn", i }); });
        page.encs.forEach((e, i) => ["ccw", "cw", "press"].forEach(s => { if (e && e[s]) fn(e[s], { prof, page, pi, kind: "enc", i, slot: s }); }));
      });
      Object.keys(prof.folders).forEach(fid => prof.folders[fid].keys.forEach((c, i) => { if (c) fn(c, { prof, fid, kind: "key", i }); }));
    });
  }
  // Rättar till en inläst konfiguration så att resten av koden kan lita på formen.
  function sanitize(deck){
    if (!deck || typeof deck !== "object" || !Array.isArray(deck.profiles) || !deck.profiles.length) return defaultDeck();
    deck.v = 2;
    deck.device = Object.assign({ brightness: 70, sleepMin: 0, map: null }, deck.device || {});
    const fixCtl = c => (c && Array.isArray(c.states) && c.states.length && c.states[0] && c.states[0].a)
      ? (c.id = c.id || uid(), c.states = c.states.slice(0, 2).filter(s => s && s.a), c.states.forEach(s => { s.look = s.look || {}; }), c) : null;
    const fixKeys = (arr, n) => Array.from({ length: n }, (_, i) => fixCtl(arr && arr[i]));
    deck.profiles.forEach(p => {
      p.id = p.id || uid(); p.name = p.name || "Profil";
      if (!Array.isArray(p.pages) || !p.pages.length) p.pages = [newPage()];
      if (!p.folders || typeof p.folders !== "object") p.folders = {};
      p.pages.forEach(pg => {
        pg.id = pg.id || uid(); pg.keys = fixKeys(pg.keys, N_KEYS); pg.btns = fixKeys(pg.btns, N_BTNS);
        pg.encs = Array.from({ length: N_ENCS }, (_, i) => {
          const e = (pg.encs && pg.encs[i]) || {};
          return { ccw: fixCtl(e.ccw), cw: fixCtl(e.cw), press: fixCtl(e.press), name: e.name || "" };
        });
      });
      Object.keys(p.folders).forEach(f => { p.folders[f] = { keys: fixKeys(p.folders[f] && p.folders[f].keys, N_KEYS) }; });
    });
    return deck;
  }

  return { N_KEYS, N_BTNS, N_ENCS, HOLD_MS, uid, newCtl, newEnc, newPage, newProfile, DIALS, applyDial, defaultDeck, migrateOld,
           toCmd, isRel, profileOf, hasBackControl, resolveView, normNav, sameNav, Engine, eachCtl, sanitize };
})();
if (typeof module !== "undefined") module.exports = DeckCore;
</script>

  const tm = performance.now();

// Tidpunkterna då en animerad knapp byter bild, över ett helt varv (högst 80 bilder).
function animTimeline(look){
  const plan = animPlan(look), total = plan.total;
  const cuts = new Set([0]);
  lookAnims(look).forEach(a => { let t = 0, k = 0; while (t < total){ cuts.add(Math.round(t)); t += a.d[k % a.n]; k++; } });
  if (plan.proc){ const n = Math.min(80, Math.round(total / 83)); for (let k = 0; k < n; k++) cuts.add(Math.round(k * total / n)); }   // rörelse: cirka tolv bilder i sekunden
  let ts = [...cuts].filter(t => t < total).sort((x, y) => x - y);
  if (ts.length > 80) ts = Array.from({ length: 80 }, (_, k) => Math.round(k * total / 80));
  return { ts, d: ts.map((t, k) => (k + 1 < ts.length ? ts[k + 1] : total) - t) };
}
function buildFaces(){
  const faces = {}, map = {}, cv = document.createElement("canvas"); cv.width = cv.height = 120;
  const ctx = cv.getContext("2d");
  const small = document.createElement("canvas"); small.width = small.height = 96;
  const sctx = small.getContext("2d");
  const add = (key, look) => {
    const hsh = hashStr(JSON.stringify(look));
    if (!faces[hsh]){
      if (FACE_CACHE[hsh]) faces[hsh] = FACE_CACHE[hsh];
      else if (isAnimated(look)){
        // animerad knapp: en färdig bild per ruta, som enheten spelar upp i tur och ordning
        const tl = animTimeline(look);
        faces[hsh] = { frames: tl.ts.map(t => { drawFace(sctx, 96, look, t + 0.01); return small.toDataURL("image/jpeg", 0.85); }), d: tl.d };
      } else { drawFace(ctx, 120, look); faces[hsh] = cv.toDataURL("image/jpeg", 0.92); }
      FACE_CACHE[hsh] = faces[hsh];
    }
    map[key] = hsh;
  };
  C.eachCtl(deck, (c, info) => { if (info.kind === "key") c.states.forEach((st, si) => add(c.id + ":" + si, effLook(st))); });
  add("__back", effLook({ a: { t:"back" } }));
  return { faces, map };
}

// Utan hubb finns bara den gamla mottagaren på kameradatorn, som bara kan fasta värden.
// Relativa steg räknas därför om till fasta värden här tills hubben är igång.
function fallbackCmds(cmd){
  const v = LIVE.vals, upd = {};
  let out = cmd;
  try {
    if (cmd.startsWith("light:")){
      const c = JSON.parse(cmd.slice(6)), g = c.group, mk = (action, value) => "light:" + JSON.stringify({ group: g, action, value });
      if (c.action === "toggle"){ const on = !(v["on:" + g] ?? false); upd["on:" + g] = on; out = mk(on ? "on" : "off", null); }
      else if (c.action === "on" || c.action === "off") upd["on:" + g] = c.action === "on";
      else if (c.action === "dim") upd["dim:" + g] = c.value;
      else if (c.action === "temp") upd["temp:" + g] = c.value;
      else if (c.action === "dim-rel"){ const n = clamp((v["dim:" + g] ?? 60) + c.value, 1, 100); upd["dim:" + g] = n; out = mk("dim", n); }
      else if (c.action === "temp-rel"){ const n = clamp((v["temp:" + g] ?? 35) + c.value, 0, 100); upd["temp:" + g] = n; out = mk("temp", n); }
      else if (c.action === "hue-rel"){ const n = (((v["hue:" + g] ?? 30) + c.value) % 360 + 360) % 360; upd["hue:" + g] = n; out = mk("color", hslHex(n)); }
    } else if (cmd.startsWith("sonos:")){
      const c = JSON.parse(cmd.slice(6));
      if (c.action === "vol-rel"){ const n = clamp((v["vol:" + c.room] ?? 30) + c.value, 0, 100); upd["vol:" + c.room] = n; out = "sonos-vol:" + JSON.stringify({ room: c.room, value: n }); }
    } else if (cmd.startsWith("sonos-vol:")){ const c = JSON.parse(cmd.slice(10)); upd["vol:" + c.room] = c.value; }
  } catch(e){}
  if (Object.keys(upd).length){ Object.assign(LIVE.vals, upd); livePatch({ vals: upd }); }
  return out;
}
function hslHex(hd){ const f = n => { const k = (n + hd / 30) % 12; return Math.round(255 * (0.5 - 0.5 * Math.max(-1, Math.min(k - 3, 9 - k, 1)))).toString(16).padStart(2, "0"); }; return f(0) + f(8) + f(4); }
function sendCmd(cmd, a){
  let out = cmd;
  if (cmd.startsWith("deck:")){
    try {   // knapparnas ljus: visa direkt i emulatorn; hubben gör samma sak på enheten
      const c = JSON.parse(cmd.slice(5)), cur = LIVE.vals["deck:bri"] ?? deck.device.brightness, upd = {};
      if (c.action === "brightness") upd["deck:bri"] = c.value;
      else if (c.action === "brightness-rel") upd["deck:bri"] = clamp(cur + c.value, 0, 100);
      else if (c.action === "sleep") upd["deck:sleep"] = true;
      else if (c.action === "wake") upd["deck:sleep"] = false;
      else if (c.action === "sleep-toggle") upd["deck:sleep"] = !LIVE.vals["deck:sleep"];
      Object.assign(LIVE.vals, upd); if (!LIVE.hub.online) livePatch({ vals: upd }); applyDeviceLight();
    } catch(e){}
  } else if (!LIVE.hub.online) out = fallbackCmds(cmd);
  lastSent = out;
  fetch("/api/send?c=" + encodeURIComponent(out)).catch(() => {});
}

async function gifToAnim(file, cover){

      const slot = Math.floor(k / step);

        const r = cover ? Math.max(W / iw, H / ih) : Math.min(W / iw, H / ih), dw = iw * r, dh = ih * r;
        ctx.save(); ctx.beginPath(); ctx.rect(x, y, W, H); ctx.clip(); ctx.drawImage(image, x + (W - dw) / 2, y + (H - dh) / 2, dw, dh); ctx.restore();
      }
      image.close();
    }
    let sheet = cv.toDataURL("image/webp", 0.86);
    if (!sheet.startsWith("data:image/webp")) sheet = cover ? cv.toDataURL("image/jpeg", 0.88) : cv.toDataURL("image/png");
    const first = document.createElement("canvas"); first.width = W; first.height = H; first.getContext("2d").drawImage(cv, 0, 0, W, H, 0, 0, W, H);
    return { asset: { sheet, n, w: W, h: H, cols, d }, first: cover ? first.toDataURL("image/jpeg", 0.9) : first.toDataURL("image/png"), cut: total > n ? total : 0 };

    openModal(title, [h("div", { class:"bd" }, inp)], [h("button", { class:"sbtnS", text:"Avbryt", onclick: closeModal }), h("button", { class:"sbtnS pri", text:"OK", onclick: ok })]);
    $("#dlg").style.width = "min(420px,100%)";
    setTimeout(() => { inp.focus(); inp.select(); }, 30);
  });
}

// ---------- enhetsinställningar och kalibrering ----------

  const body = h("div", { class:"bd" },
    h("div", { class:"gcat", text:"Skärmarna på knapparna" }),

    field("Släck efter", h("input", { class:"in n", type:"number", min:0, max:600, value: d.sleepMin, oninput: e => mutate(() => { d.sleepMin = clamp(+e.target.value || 0, 0, 600); }, { co:"devsleep", re:false }) }), h("span", { class:"note", style:{ margin:0 }, text:"minuter utan tryck (0 = aldrig). Första trycket väcker bara." })),
    h("div", { class:"gcat", text:"Hubben och den fysiska enheten" }),
    h("div", { class:"kv" }, h("span", { text:"Hubb på Pi:n" }), h("span", { text: hb.online ? "Igång" + (hb.name ? " (" + hb.name + ")" : "") + (hb.ver ? ", version " + hb.ver : "") : "Hörs inte av" }),
      h("span", { text:"Stream Controller" }), h("span", { text: hb.device ? "Ansluten via USB" : hb.online ? "Inte inkopplad" : "–" }),
      h("span", { text:"Kommandon på Pi:n" }), h("span", { text: (hb.online && (hb.sys || []).join(", ")) || "–" })),
    h("div", { class:"note", html: hb.online ? "Emulatorn och enheten följs åt: byter du sida eller trycker på en knapp på den ena syns det på den andra."
      : "Utan hubb fungerar emulatorn ändå: kommandona går till samma kö som förut. Steg-åtgärder (ljusare, volym upp) räknas då om till fasta värden här i webbläsaren." }),
    h("div", { style:{ display:"flex", gap:"8px", flexWrap:"wrap", marginTop:"10px" } },
      h("button", { class:"sbtnS", disabled: !hb.device, title: hb.device ? "" : "Kräver att enheten är inkopplad till hubben", onclick: startCalib }, icon("sliders"), "Lär in knapparnas ordning…"),
      d.map ? h("button", { class:"sbtnS", text:"Återställ ordningen", onclick: () => { mutate(() => { d.map = null; }); closeModal(); toast("Standardordningen gäller igen."); } }) : null,
      h("button", { class:"sbtnS", text:"Nollställ tvålägesknappar", title:"Alla knappar med två lägen går tillbaka till läge 1", onclick: () => { engine.st = {}; livePatch({ stReset: true }); renderDevice(); toast("Alla tvålägesknappar står i läge 1."); } })),
    h("div", { class:"gcat", text:"Säkerhetskopia" }),
    h("div", { style:{ display:"flex", gap:"8px", flexWrap:"wrap" } },
      h("button", { class:"sbtnS", onclick: () => download("stream-controller.json", JSON.stringify({ blaupunktDeck: 2, deck }, null, 1)) }, icon("arrow-down"), "Exportera allt"),
      h("button", { class:"sbtnS", onclick: async () => { const f = await pickFile(".json,application/json"); if (!f) return;
        try { const j = JSON.parse(await f.text()); if (!j.deck || !Array.isArray(j.deck.profiles)) throw 0; mutate(() => { deck = C.sanitize(j.deck); editNav = { p:"", pg:0, stack:[] }; sel = null; }); renderAll(); closeModal(); toast("Konfigurationen lästes in."); }
        catch(e){ toast("Filen gick inte att läsa som en konfiguration."); } } }, icon("arrow-up"), "Läs in…"),
      h("button", { class:"sbtnS danger", text:"Börja om från standard", onclick: () => { mutate(() => { deck = C.defaultDeck(); editNav = { p:"", pg:0, stack:[] }; sel = null; }); renderAll(); closeModal(); toast("Standarduppsättningen är inläst. Ångra med Ctrl+Z."); } })));
  openModal("Enhetsinställningar", [body], [h("button", { class:"sbtnS pri", text:"Klar", onclick: closeModal })]);

// Kalibreringen: tryck/vrid varje kontroll i tur och ordning, så lär sig hubben vilken som är vilken.
const CAL_STEPS = [
  ...[0,1,2,3,4,5].map(i => ({ kind:"key", i, text:"Tryck på skärmknapp " + (i + 1), sub: ["övre raden, vänster","övre raden, mitten","övre raden, höger","nedre raden, vänster","nedre raden, mitten","nedre raden, höger"][i] })),
  ...[0,1,2].map(i => ({ kind:"btn", i, text:"Tryck på liten knapp " + (i + 1), sub: ["vänster","mitten","höger"][i] })),
  ...[0,1,2].map(i => ({ kind:"enc", i, text:"Vrid " + ["stora ratten","lilla ratten till vänster","lilla ratten till höger"][i], sub:"åt höger (medurs)" })),
  ...[0,1,2].map(i => ({ kind:"encp", i, text:"Tryck ner " + ["stora ratten","lilla ratten till vänster","lilla ratten till höger"][i], sub:"" }))
];
function startCalib(){
  calib = { n: 0, map: { key:[], btn:[], enc:[], encp:[], encDir:[] }, lastAt: 0, used: new Set() };
  drawCalib();
}
function drawCalib(){
  const s = CAL_STEPS[calib.n];
  const body = h("div", { class:"bd" }, h("div", { class:"note", text:"Gör en sak i taget på den riktiga enheten. Det tar ungefär en halv minut." }),
    h("div", { class:"calib" }, h("div", {}, h("div", { class:"big", text: s.text }), h("div", { class:"note", text: s.sub }))),
    h("div", { class:"prog" }, h("i", { style:{ width: (calib.n / CAL_STEPS.length * 100) + "%" } })));
  const keep = calib; openModal("Lär in knapparnas ordning (" + (calib.n + 1) + " av " + CAL_STEPS.length + ")", [body], [h("button", { class:"sbtnS", text:"Avbryt", onclick: closeModal })]); calib = keep;
}
function calibEvent(e){
  const s = CAL_STEPS[calib.n], now = Date.now();
  if (now - calib.lastAt < 350) return;
  const isEnc = e.rk === "enc", id = e.rk + e.ri;
  if (s.kind === "enc"){ if (!isEnc) return; if (calib.map.enc.includes(e.ri)) return; calib.map.enc[s.i] = e.ri; calib.map.encDir[s.i] = e.d < 0 ? -1 : 1; }
  else { if (isEnc || !e.d || calib.used.has(id)) return; calib.used.add(id); calib.map[s.kind][s.i] = e.ri; }
  calib.lastAt = now; calib.n++;
  if (calib.n >= CAL_STEPS.length){ const map = calib.map; calib = null; mutate(() => { deck.device.map = map; }); closeModal(); toast("Klart. Enheten och emulatorn har nu samma ordning.", 4000); }
  else drawCalib();
}

// ---------- läge, tangenter, start ----------
function setMode(m){
  mode = m; prefs.set("mode", m);
  $("#app").className = "mode-" + m;
  if (m === "use"){ sel = null; engine.view(); }
  closeMenu(); renderAll(); setTimeout(fitDevice, 0);
}
function renderAll(){ renderTop(); renderCrumb(); renderDevice(); renderSide(); renderInspector(); renderHub(); }
document.addEventListener("keydown", ev => {
  const inField = /^(INPUT|TEXTAREA|SELECT)$/.test((ev.target.tagName || ""));
  if (ev.key === "Escape"){ closeMenu(); if ($("#modal").classList.contains("open")) closeModal(); return; }
  if ($("#modal").classList.contains("open")) return;
  const mod = ev.ctrlKey || ev.metaKey, k = ev.key.toLowerCase();
  if (mode === "edit"){
    if (mod && k === "z" && !ev.shiftKey){ if (inField) return; ev.preventDefault(); doUndo(undo, redo); return; }
    if (mod && (k === "y" || (k === "z" && ev.shiftKey))){ if (inField) return; ev.preventDefault(); doUndo(redo, undo); return; }
    if (inField) return;
    if (mod && k === "c"){ copySel(); return; }
    if (mod && k === "x"){ copySel(); delSel(); return; }
    if (mod && k === "v"){ pasteSel(); return; }
    if (k === "delete" || k === "backspace"){ delSel(); return; }
  } else if (!inField && !ev.repeat){
    if (/^[1-6]$/.test(ev.key)){ const i = +ev.key - 1; useInput("key", i, true); const up = e2 => { if (e2.key === ev.key){ useInput("key", i, false); document.removeEventListener("keyup", up); } }; document.addEventListener("keyup", up); }
  }
  if (mode === "use" && !inField && (ev.key === "ArrowLeft" || ev.key === "ArrowRight")) useRotate(0, ev.key === "ArrowLeft" ? -1 : 1);
});
document.addEventListener("pointerdown", ev => { if (!ev.target.closest("#menu")) closeMenu(); }, true);
$("#modal").addEventListener("pointerdown", ev => { if (ev.target.id === "modal") closeModal(); });
window.addEventListener("resize", fitDevice);
window.addEventListener("beforeunload", ev => { if (dirty || saving){ ev.preventDefault(); ev.returnValue = ""; } });
document.addEventListener("visibilitychange", () => { if (!document.hidden) pollLive(); });

(async function init(){
  $("#brandIc").innerHTML = iconSvg("back"); $("#profIc").innerHTML = iconSvg("layers");
  $("#undoBtn").innerHTML = iconSvg("up-level"); $("#redoBtn").innerHTML = iconSvg("up-level"); $("#redoBtn").firstChild.style.transform = "scaleX(-1)";
  $("#deviceBtn").innerHTML = iconSvg("gear"); $("#scenesIc").innerHTML = iconSvg("sparkles"); $("#scenesBtn").onclick = () => sceneModal();
  $("#inputsIc").innerHTML = iconSvg("antenna"); $("#inputsBtn").onclick = inputsModal;
  $("#undoBtn").onclick = () => doUndo(undo, redo); $("#redoBtn").onclick = () => doUndo(redo, undo);

  $("#modeSeg").addEventListener("click", ev => { const b = ev.target.closest("button"); if (b) setMode(b.dataset.m); });
  buildDevice();
  let fresh = false;
  try { fresh = await loadDeck(); } catch(e){ deck = C.defaultDeck(); toast("Kunde inte läsa konfigurationen från servern."); }
  await loadGroups(); loadSpotify();
  await ensureSensors();
  editNav = C.normNav(deck, {}); engine.nav = C.normNav(deck, {});
  try { const j = await (await fetch("/api/deck/live?ev=0", { cache:"no-store" })).json();
    LIVE.navRev = j.navRev; LIVE.stRev = j.stRev; LIVE.valsRev = j.valsRev; LIVE.vals = j.vals || {}; LIVE.evLast = j.evLast; LIVE.hub = j.hub || LIVE.hub;
    if (j.nav) engine.nav = C.normNav(deck, j.nav); engine.st = Object.assign({}, j.st || {}); } catch(e){}
  const want = new URLSearchParams(location.search).get("mode") || prefs.get("mode", "edit");
  setMode(want === "use" ? "use" : "edit");
  setSaveState("");
  if (fresh) scheduleSave();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { renderDevice(); refreshPreview(); });
  setInterval(pollLive, 500);
  setInterval(loadGroups, 60000);
  new ResizeObserver(fitDevice).observe($("#deviceWrap"));
  window.DECKDBG = { get deck(){ return deck; }, engine, LIVE, effLook, buildFaces, get sel(){ return sel; } };
})();
