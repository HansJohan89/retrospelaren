<!doctype html>
<html lang="sv" translate="no">
<head>
<meta charset="utf-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blaupunkt Nest</title>
<style>
:root{--bg:#0b0b0a;--tx:#ece7d8;--mid:#a59f8a;--line:#2a2823;--acc:#e8a33d;--card:#131311}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--tx);font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;overflow:hidden;cursor:none}
#wrap{position:absolute;inset:0;display:grid;grid-template-columns:1.25fr 1fr;gap:28px;padding:34px 40px;transition:transform 2s,opacity 2s}
body.night #wrap{opacity:.45}
.clock{font-size:150px;font-weight:800;line-height:.9;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.date{font-size:26px;color:var(--mid);margin-top:12px;text-transform:capitalize}
.wx{display:flex;align-items:center;gap:18px;margin-top:30px}
.wx svg{width:64px;height:64px;color:var(--acc);flex:none}
.wxT{font-size:52px;font-weight:800;line-height:1}
.wxS{font-size:19px;color:var(--mid);margin-top:4px}
.bus{margin-top:26px;border-top:1px solid var(--line);padding-top:16px}
.busH{font-size:13px;letter-spacing:.18em;color:var(--mid);text-transform:uppercase;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.busH svg{width:16px;height:16px}
.dep{display:flex;align-items:center;gap:14px;font-size:22px;padding:5px 0}
.line{min-width:46px;text-align:center;border:1.5px solid var(--tx);border-radius:5px;padding:1px 6px;font-size:18px;font-weight:700}
.dep .to{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--mid)}
.dep .t{font-weight:700;font-variant-numeric:tabular-nums}
.dep.first .t{color:var(--acc)}
.side{display:flex;flex-direction:column;gap:18px;min-width:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:20px}
.now{display:flex;flex-direction:column;gap:14px}
.art{width:100%;aspect-ratio:1;max-height:270px;object-fit:cover;border-radius:14px;background:#000}
.nowT{font-size:26px;font-weight:750;line-height:1.15;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.nowA{font-size:19px;color:var(--mid);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row{display:flex;align-items:center;gap:14px;font-size:21px}
.row svg{width:26px;height:26px;color:var(--acc);flex:none}
.row b{margin-left:auto;color:var(--acc)}
.mut{color:var(--mid)}
#ring{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:radial-gradient(circle at 50% 40%,#3a1d0d,#0b0b0a 70%);z-index:5}
#ring.on{display:flex}
#ring svg{width:110px;height:110px;color:var(--acc);animation:sh 1.2s infinite}
@keyframes sh{0%,100%{transform:rotate(0)}20%{transform:rotate(-12deg)}40%{transform:rotate(10deg)}60%{transform:rotate(-6deg)}}
#ring .big{font-size:120px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
#ring .nm{font-size:30px;color:var(--mid)}
</style>
</head>
<body>
<div id="wrap">
  <div>
    <div class="clock" id="clock">--:--</div>
    <div class="date" id="date"></div>
    <div class="wx" id="wx"></div>
    <div class="bus" id="bus" hidden></div>
  </div>
  <div class="side" id="side"></div>
</div>
<div id="ring"><span id="ringIc"></span><div class="big" id="ringT"></div><div class="nm" id="ringN"></div></div>
<script>
// Nest Hub-skärmen: bara visning, castad hit av hubben på Pi:n (hub/nestcast.py). Styrs från appen.
const $ = s => document.querySelector(s);
const pad = n => String(n).padStart(2, "0");
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));
const IC = {
  sun:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6"/></svg>',
  moon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>',
  cloud:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M7 17.5a4 4 0 0 1 .4-7.96A5 5 0 0 1 17 10.5a3.5 3.5 0 0 1-.5 7H7Z"/></svg>',
  rain:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M7 14.5a4 4 0 0 1 .4-7.96A5 5 0 0 1 17 7.5a3.5 3.5 0 0 1-.5 7H7Z"/><path d="M9 17.5l-1 2.5M13 17.5l-1 2.5M17 17.5l-1 2.5"/></svg>',
  snow:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M12 3v18M4.2 7.5l15.6 9M4.2 16.5l15.6-9"/></svg>',
  bolt:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M13 2.5 5 13.5h6l-1 8 8-11h-6l1-8z"/></svg>',
  bell:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 16.5V11a6 6 0 0 1 12 0v5.5l1.5 2h-15z"/><path d="M10 20.5a2 2 0 0 0 4 0"/></svg>',
  bus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><rect x="4.5" y="3.5" width="15" height="14" rx="2.5"/><path d="M4.5 11.5h15M8 20.5v-3M16 20.5v-3"/></svg>',
  note:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5.5l11-2V16"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="17.5" cy="16" r="2.5"/></svg>',
  spark:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/></svg>',
};
const wxIc = (c, day) => c <= 1 ? (day ? IC.sun : IC.moon) : c <= 48 ? IC.cloud : (c >= 71 && c <= 77) || c === 85 || c === 86 ? IC.snow : c >= 95 ? IC.bolt : IC.rain;
const WXT = c => c===0?"Klart":c===1?"Mest klart":c===2?"Halvklart":c===3?"Mulet":(c===45||c===48)?"Dimma":(c>=51&&c<=57)?"Duggregn":(c>=61&&c<=67)?"Regn":(c>=71&&c<=77)?"Snö":(c>=80&&c<=82)?"Regnskurar":(c===85||c===86)?"Snöbyar":(c>=95)?"Åska":"";
const hhmm = ts => { const d = new Date(ts * 1000); const t = pad(d.getHours()) + ":" + pad(d.getMinutes());
  const days = Math.round((new Date(d).setHours(0,0,0,0) - new Date().setHours(0,0,0,0)) / 864e5);
  return days === 0 ? t : days === 1 ? "i morgon " + t : ["sön","mån","tis","ons","tor","fre","lör"][d.getDay()] + " " + t; };
let S = {}, WX = null, DEP = [], BUSNAME = "", ST = {}, NOW = {}, CFG = {};

function clock(){
  const d = new Date();
  $("#clock").textContent = pad(d.getHours()) + ":" + pad(d.getMinutes());
  $("#date").textContent = d.toLocaleDateString("sv-SE", { weekday:"long", day:"numeric", month:"long" });
  const hr = d.getHours();
  document.body.classList.toggle("night", hr >= 23 || hr < 6);
  // flytta innehållet några punkter då och då så att skärmen inte bränner in
  const k = Math.floor(Date.now() / 300000);
  $("#wrap").style.transform = `translate(${(k % 5) * 3 - 6}px,${(k % 3) * 3 - 3}px)`;
}
function renderWx(){
  if (!WX){ $("#wx").innerHTML = ""; return; }
  $("#wx").innerHTML = wxIc(WX.c, WX.day) + `<div><div class="wxT">${Math.round(WX.t)}°</div><div class="wxS">${esc(WXT(WX.c))} · ${Math.round(WX.hi)}° / ${Math.round(WX.lo)}°${WX.rain >= 30 ? " · nederbörd " + WX.rain + " %" : ""}</div></div>`;
}
function renderBus(){
  const now = Date.now();
  const list = DEP.filter(x => !x.canceled && new Date(x.rt || x.sched) > now).slice(0, 3);
  const el = $("#bus");
  el.hidden = !list.length;
  if (!list.length) return;
  el.innerHTML = `<div class="busH">${IC.bus}${esc(BUSNAME || "Bussen")}</div>` + list.map((x, i) => { const t = new Date(x.rt || x.sched); const m = Math.round((t - now) / 60000);
    return `<div class="dep${i ? "" : " first"}"><span class="line">${esc(x.line || "")}</span><span class="to">${esc(x.dest || "")}</span><span class="t">${m <= 15 ? m + " min" : pad(t.getHours()) + ":" + pad(t.getMinutes())}</span></div>`; }).join("");
}
function renderSide(){
  const side = $("#side"); let html = "";
  const runs = (ST.runs || []).filter(r => ST.runsAt && Date.now() / 1000 - ST.runsAt < 120);
  // larmet ringer: hela skärmen
  const ring = runs.find(r => r.alarm);
  const ringEl = $("#ring");
  if (ring){
    const a = (CFG.alarms || []).find(x => x.id === ring.alarm) || {};
    $("#ringIc").innerHTML = IC.bell; $("#ringT").textContent = $("#clock").textContent; $("#ringN").textContent = (a.name ? a.name + " · " : "") + "stäng av eller snooza i appen";
  }
  ringEl.classList.toggle("on", !!ring);
  if (NOW.playing && (NOW.title || NOW.art)){
    html += `<div class="card now">${NOW.art ? `<img class="art" src="${esc(NOW.art)}" alt="">` : ""}<div><div class="nowT">${esc(NOW.title || "")}</div><div class="nowA">${esc([NOW.artist, NOW.room].filter(Boolean).join(" · "))}</div></div></div>`;
  }
  const rows = [];
  const ids = new Set((CFG.alarms || []).filter(a => a.on !== false).map(a => "alarm-" + a.id));
  const up = [...Object.entries(ST.snoozed || {}).map(([id, at]) => ({ id, at, sn: true })), ...(ST.upcoming || []).filter(u => ids.has(String(u.id)))].sort((a, b) => a.at - b.at)[0];
  if (up) rows.push(`<div class="row">${IC.bell}<span>${up.sn ? "Snoozat" : "Larm"}</span><b>${esc(hhmm(up.at))}</b></div>`);
  const sl = ST.sleep && ST.sleep.end * 1000 > Date.now() ? ST.sleep : null;
  if (sl) rows.push(`<div class="row">${IC.moon}<span>Tystnar ${esc(hhmm(sl.end))}</span><b>${Math.max(0, Math.round((sl.end * 1000 - Date.now()) / 60000))} min</b></div>`);
  runs.filter(r => !r.alarm).slice(0, 3).forEach(r => rows.push(`<div class="row">${IC.spark}<span>${esc(r.name || "Scen")}</span><b class="mut">på</b></div>`));
  if (!NOW.playing && !rows.length) rows.push(`<div class="row mut">${IC.note}<span>Inget spelas</span></div>`);
  if (rows.length) html += `<div class="card" style="display:flex;flex-direction:column;gap:14px">${rows.join("")}</div>`;
  side.innerHTML = html;
}
async function fast(){
  try {
    const [a, b] = await Promise.all([fetch("/api/tradfri-list", { cache:"no-store" }).then(r => r.json()), fetch("/api/sonos-now", { cache:"no-store" }).then(r => r.json())]);
    ST = a || {}; NOW = b || {};
  } catch(e){}
  renderSide();
}
async function slow(){
  try { const j = await (await fetch("/api/state", { cache:"no-store" })).json(); S = (j && j.settings) || {}; } catch(e){}
  try { CFG = await (await fetch("/api/scenes", { cache:"no-store" })).json() || {}; } catch(e){}
  const e = Object.assign({ lat:60.6065, lon:15.6355 }, S.edge || {});
  try {
    const j = await (await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${e.lat}&longitude=${e.lon}&current=temperature_2m,weather_code,is_day&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=auto&forecast_days=1`)).json();
    WX = { t:j.current.temperature_2m, c:j.current.weather_code, day:j.current.is_day === 1, hi:j.daily.temperature_2m_max[0], lo:j.daily.temperature_2m_min[0], rain:j.daily.precipitation_probability_max[0] };
  } catch(err){}
  renderWx();
}
async function bus(){
  const b = S.bus || {};
  if (b.on === false || !b.id){ DEP = []; renderBus(); return; }
  try {
    const u = b.to ? `/api/trip?from=${encodeURIComponent(b.id)}&to=${encodeURIComponent(b.to)}` : "/api/departures?id=" + encodeURIComponent(b.id);
    const j = await (await fetch(u)).json(); DEP = Array.isArray(j) ? j : [];
    BUSNAME = String(b.name || "").replace(/\s*\([^)]*\)\s*$/, "");
  } catch(err){}
  renderBus();
}
clock(); setInterval(clock, 5000);
slow().then(bus); setInterval(slow, 15 * 60000); setInterval(bus, 120000); setInterval(renderBus, 30000);
fast(); setInterval(fast, 5000);
// en ny version av sidan: ladda om (Nest Hub har sidan uppe i flera dygn)
setInterval(() => location.reload(), 6 * 3600 * 1000);
</script>
</body>
</html>
