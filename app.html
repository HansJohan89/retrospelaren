<!doctype html>
<html lang="sv" translate="no">
<head>
<meta charset="utf-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e0f11">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="/app.webmanifest">
<link rel="icon" href="/assets/app-icon-192.png">
<title>Blaupunkt</title>
<style>
:root{--bg:#0e0f11;--card:#17191d;--card2:#1d2025;--line:#262a30;--line2:#30353d;--tx:#eceae4;--mut:#959aa3;--dim:#5d626b;--acc:#e8a33d;--accInk:#1a1204;--ok:#30d158;--bad:#ff5a4f;--tab:64px;--player:0px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 "Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
svg.ic{width:20px;height:20px;flex:none}
.hidden{display:none!important}
/* rubrik */
header.top{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:12px;padding:calc(env(safe-area-inset-top) + 10px) 18px 10px;background:rgba(14,15,17,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.brand{font-weight:800;letter-spacing:.34em;font-size:13px;color:var(--acc)}
.ttl{font-weight:700;font-size:15px;color:var(--mut);margin-left:4px}
.hubdot{margin-left:auto;display:flex;align-items:center;gap:7px;font-size:12px;color:var(--mut)}
.hubdot i{width:9px;height:9px;border-radius:50%;background:var(--dim)}
.hubdot.ok i{background:var(--ok);box-shadow:0 0 8px rgba(48,209,88,.6)}
main{max-width:620px;margin:0 auto;padding:14px 14px calc(var(--tab) + var(--player) + env(safe-area-inset-bottom) + 20px)}
.panel{display:none}.panel.on{display:block}
/* flikar */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;padding:6px 4px calc(env(safe-area-inset-bottom) + 6px);background:#15171a;border-top:1px solid var(--line)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:0;color:var(--mut);font-size:11px;font-weight:650;padding:7px 0;border-radius:12px;position:relative}
.tab svg{width:24px;height:24px}
.tab.on{color:var(--acc);background:rgba(232,163,61,.1)}
.tab.alert::after{content:"";position:absolute;top:5px;right:calc(50% - 17px);width:9px;height:9px;border-radius:50%;background:var(--bad);box-shadow:0 0 8px var(--bad);animation:pulse 1s infinite alternate}
@keyframes pulse{to{opacity:.3}}
/* kort och kontroller */
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 16px;margin-bottom:14px}
.lbl{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--acc);font-weight:750;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.lbl .more{margin-left:auto;letter-spacing:normal;text-transform:none;color:var(--mut);font-weight:600;font-size:13px;background:none;border:0;padding:0}
.sub{font-size:12.5px;color:var(--mut);font-weight:650;margin:12px 0 7px}
.hint{font-size:12.5px;color:var(--mut);margin:6px 0;line-height:1.45}
.mut{color:var(--mut)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.row.nw{flex-wrap:nowrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 15px;border-radius:12px;border:1px solid var(--line2);background:#22262c;color:var(--tx);font-weight:650;font-size:14px}
.btn:active,.chip:active,.tile:active{transform:scale(.97)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--accInk)}
.btn.bad{background:transparent;border-color:var(--bad);color:var(--bad)}
.btn.big{min-height:54px;flex:1;font-size:15px}
.btn.ghost{background:transparent}
.btn.sq{width:44px;padding:0}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips.scroll::-webkit-scrollbar{display:none}
.chip{flex:none;height:38px;padding:0 15px;border-radius:19px;border:1px solid var(--line2);background:var(--card2);color:var(--tx);font-weight:650;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.chip.on{background:var(--acc);border-color:var(--acc);color:var(--accInk)}
.sw{flex:none;width:52px;height:30px;border-radius:15px;border:0;background:#3a3f47;position:relative;transition:background .15s;padding:0}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#e8e9ec;transition:left .15s}
.sw.on{background:var(--ok)}.sw.on::after{left:25px}
.range{width:100%;height:32px;accent-color:var(--acc);margin:0}
.slab{display:flex;justify-content:space-between;font-size:12.5px;color:var(--mut);margin-top:10px}
.slab b{color:var(--tx);font-weight:650}
.in{width:100%;min-height:46px;border-radius:12px;border:1px solid var(--line2);background:#0f1113;color:var(--tx);padding:0 13px;font-size:15px}
select.in{appearance:auto}
textarea.in{padding:10px 13px}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 0;border-top:1px solid #22262c}
.setrow:first-child{border-top:0}
.setrow .t{font-weight:600}
.setrow .s{font-size:12.5px;color:var(--mut)}
.toast{position:fixed;left:50%;bottom:calc(var(--tab) + var(--player) + env(safe-area-inset-bottom) + 18px);transform:translateX(-50%) translateY(20px);opacity:0;z-index:90;background:#2a2e35;border:1px solid var(--line2);padding:11px 18px;border-radius:14px;font-weight:600;font-size:14px;transition:.2s;pointer-events:none;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%)}
.empty{color:var(--mut);text-align:center;padding:26px 10px;font-size:14px}
.spin{width:22px;height:22px;border:3px solid #333;border-top-color:var(--acc);border-radius:50%;animation:spin .8s linear infinite;margin:20px auto}
@keyframes spin{to{transform:rotate(360deg)}}
/* bladet underifrån */
.sheetBg{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:70;opacity:0;pointer-events:none;transition:opacity .2s}
.sheetBg.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:71;max-height:86vh;overflow:auto;background:#16181c;border-top:1px solid var(--line2);border-radius:22px 22px 0 0;padding:10px 18px calc(env(safe-area-inset-bottom) + 20px);transform:translateY(105%);transition:transform .25s cubic-bezier(.2,.8,.2,1)}
.sheet.on{transform:none}
.sheet .grab{width:42px;height:5px;border-radius:3px;background:#3a3f47;margin:2px auto 12px}
.sheet h3{margin:4px 0 12px;font-size:18px}
@media (min-width:700px){.sheet{left:50%;right:auto;width:560px;margin-left:-280px}}
/* ---- Skärmen ---- */
.shot{position:relative;width:100%;aspect-ratio:16/9;border-radius:14px;overflow:hidden;background:#000;border:1px solid var(--line2)}
.shot img{width:100%;height:100%;object-fit:contain;display:block}
.shot .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--mut);font-size:13px;padding:20px}
.shotmeta{display:flex;justify-content:space-between;color:var(--mut);font-size:12.5px;margin-top:8px}
.big2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.tile{display:flex;align-items:center;gap:10px;min-height:58px;padding:0 14px;border-radius:14px;border:1px solid var(--line2);background:var(--card2);color:var(--tx);font-weight:650;font-size:14px;text-align:left}
.tile svg{width:22px;height:22px;color:var(--acc);flex:none}
.tile.on{background:rgba(232,163,61,.16);border-color:var(--acc)}
.tile small{display:block;font-weight:500;color:var(--mut);font-size:12px}
.padframe{width:100%;border:0;border-radius:14px;background:#0e0f11;height:520px;display:block}
/* ---- Musik ---- */
.mlay{display:flex;gap:12px;align-items:flex-start}
.mrail{position:sticky;top:64px;flex:none;width:58px;display:flex;flex-direction:column;gap:8px;max-height:calc(100vh - 64px - var(--tab) - var(--player) - 30px);overflow-y:auto;scrollbar-width:none;padding-bottom:8px}
.mrail::-webkit-scrollbar{display:none}
.ri{width:56px;height:56px;border-radius:14px;border:2px solid transparent;background:var(--card2);color:var(--tx);display:flex;align-items:center;justify-content:center;padding:0;overflow:hidden;flex:none;position:relative}
.ri svg{width:26px;height:26px}
.ri img{width:100%;height:100%;object-fit:cover}
.ri.sel{border-color:var(--acc)}
.rsep{height:1px;background:var(--line2);margin:2px 8px}
.mmain{flex:1;min-width:0}
.mhead{display:flex;gap:14px;align-items:flex-end;margin-bottom:14px}
.mhead img,.mhead .nocov{width:120px;height:120px;border-radius:12px;object-fit:cover;flex:none;background:var(--card2);display:flex;align-items:center;justify-content:center;color:var(--dim)}
.mhead h2{margin:0 0 4px;font-size:21px;line-height:1.15}
.tl{display:flex;flex-direction:column}
.tr{display:flex;align-items:center;gap:11px;padding:8px 6px;border-radius:10px;background:none;border:0;color:var(--tx);text-align:left;width:100%}
.tr:active{background:var(--card2)}
.tr img,.tr .nocov{width:44px;height:44px;border-radius:7px;object-fit:cover;flex:none;background:var(--card2);display:flex;align-items:center;justify-content:center;color:var(--dim)}
.tr .tt{flex:1;min-width:0}
.tr .t1{font-weight:620;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tr .t2{font-size:12.5px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tr .dur{font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums}
.tr.now .t1{color:var(--acc)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:12px}
.gi{background:none;border:0;padding:0;text-align:left;color:var(--tx)}
.gi img,.gi .nocov{width:100%;aspect-ratio:1;border-radius:12px;object-fit:cover;background:var(--card2);display:flex;align-items:center;justify-content:center;color:var(--dim)}
.gi .t1{font-weight:620;font-size:13.5px;margin-top:6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.gi .t2{font-size:12px;color:var(--mut)}
.gi.round img{border-radius:50%}
.sect{font-size:16px;font-weight:750;margin:18px 0 10px}
.sect:first-child{margin-top:0}
/* spelaren */
.player{position:fixed;left:0;right:0;bottom:calc(var(--tab) + env(safe-area-inset-bottom));z-index:45;background:#17191d;border-top:1px solid var(--line2);padding:10px 14px 12px;display:none}
body.tab-musik .player{display:block}
.player .in2{max-width:620px;margin:0 auto}
.prow{display:flex;align-items:center;gap:12px}
.pcov{width:52px;height:52px;border-radius:9px;object-fit:cover;flex:none;background:var(--card2);display:flex;align-items:center;justify-content:center;color:var(--dim);overflow:hidden}
.pcov img{width:100%;height:100%;object-fit:cover}
.ptxt{flex:1;min-width:0}
.pt1{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pt2{font-size:12.5px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.picon{background:none;border:0;color:var(--tx);padding:6px;display:flex}
.picon svg{width:24px;height:24px}
.picon.on{color:var(--acc)}
.scrub{margin-top:8px}
.sbar{position:relative;height:18px;cursor:pointer;touch-action:none}
.sbar::before{content:"";position:absolute;left:0;right:0;top:7px;height:4px;border-radius:2px;background:#33373e}
.sbar i{position:absolute;left:0;top:7px;height:4px;border-radius:2px;background:var(--acc)}
.sbar b{position:absolute;top:3px;width:12px;height:12px;margin-left:-6px;border-radius:50%;background:var(--tx)}
.stime{display:flex;justify-content:space-between;font-size:11.5px;color:var(--mut);font-variant-numeric:tabular-nums}
.ctl{display:flex;align-items:center;justify-content:space-between;margin-top:4px}
.ib{background:none;border:0;color:var(--tx);width:46px;height:46px;display:flex;align-items:center;justify-content:center;border-radius:50%}
.ib svg{width:26px;height:26px}
.ib.on{color:var(--acc)}
.ib.dim{color:var(--mut)}
.playbtn{width:60px;height:60px;border-radius:50%;border:0;background:var(--acc);color:var(--accInk);display:flex;align-items:center;justify-content:center}
.playbtn svg{width:30px;height:30px}
.vol{display:flex;align-items:center;gap:10px;color:var(--mut)}
.roomBtn{display:flex;align-items:center;gap:6px;background:none;border:0;color:var(--acc);font-weight:700;font-size:13px;padding:4px 0}
.roomBtn svg{width:17px;height:17px}
.player.mini .scrub,.player.mini .ctl,.player.mini .vol{display:none}
.player:not(.mini) #npPP2{display:none}
.roomBtn span{white-space:nowrap;max-width:110px;overflow:hidden;text-overflow:ellipsis}
/* ---- Ljus ---- */
.lamp{padding:10px 0;border-top:1px solid #22262c}
.lamp:first-child{border-top:0}
.lh{display:flex;align-items:center;gap:10px}
.ldot{width:13px;height:13px;border-radius:50%;flex:none}
.lname{flex:1;font-weight:620}
.dots{display:flex;flex-wrap:wrap;gap:9px;margin-top:10px}
.dot{width:36px;height:36px;border-radius:50%;border:2px solid #0e0f11;box-shadow:0 0 0 1px #3a3f47;padding:0}
.ghead{display:flex;align-items:center;gap:8px}
.gname{flex:1;display:flex;align-items:center;gap:9px;background:none;border:0;color:var(--tx);font-weight:700;font-size:16px;text-align:left;padding:4px 0}
.gname svg{color:var(--acc)}
/* ---- Larm ---- */
.seg3{display:flex;background:var(--card2);border:1px solid var(--line2);border-radius:14px;padding:4px;gap:4px;margin-bottom:14px}
.seg3 button{flex:1;min-height:42px;border:0;border-radius:10px;background:none;color:var(--mut);font-weight:700;display:flex;align-items:center;justify-content:center;gap:7px}
.seg3 button.on{background:var(--acc);color:var(--accInk)}
.alarm{display:flex;align-items:center;justify-content:space-between;gap:12px;cursor:pointer}
.alarm.off{opacity:.5}
.atime{font-size:42px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.05}
.ring{background:linear-gradient(135deg,#3a1d0d,#1d1308);border:1px solid var(--acc);border-radius:18px;padding:16px;margin-bottom:14px;animation:glow 1.6s infinite alternate}
@keyframes glow{to{box-shadow:0 0 26px rgba(232,163,61,.35)}}
.ringT{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:800}
.ringT svg{width:28px;height:28px;color:var(--acc)}
.days{display:flex;gap:6px}
.day{flex:1;height:46px;border-radius:12px;border:1px solid var(--line2);background:var(--card2);color:var(--mut);font-weight:750}
.day.on{background:var(--acc);border-color:var(--acc);color:var(--accInk)}
.timeIn{font-size:40px;height:72px;font-weight:800;text-align:center;font-variant-numeric:tabular-nums;color-scheme:dark}
.countdown{font-size:34px;font-weight:800;font-variant-numeric:tabular-nums}
/* ---- Inställningar ---- */
.menu{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;margin-bottom:16px}
.mrow{display:flex;align-items:center;gap:13px;padding:12px 14px;border-top:1px solid #22262c;cursor:pointer}
.mrow:first-child{border-top:0}
.mrow:active{background:var(--card2)}
.mico{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex:none;background:#2a2219;color:var(--acc)}
.mt{font-weight:650}
.ms{font-size:12.5px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.marrow{margin-left:auto;color:var(--dim);font-size:22px}
.secT{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--mut);font-weight:750;margin:6px 4px 8px}
.pagehead{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.back{width:42px;height:42px;border-radius:12px;border:1px solid var(--line2);background:var(--card2);color:var(--tx);font-size:22px;line-height:1}
.pagetitle{font-size:18px;font-weight:750}
.pframe{width:100%;border:0;display:block;min-height:200px;background:transparent}
/* Nest Hub: klockvyn när ingen rört skärmen */
#amb,#ambCover{display:none}
body.idle #amb{display:block;position:fixed;inset:0;width:100vw;height:100vh;border:0;z-index:95;background:#0b0b0a}
body.idle #ambCover{display:block;position:fixed;inset:0;z-index:96}
/* liggande skärm (surfplatta, Nest Hub): flikarna till vänster */
@media (min-width:860px) and (orientation:landscape){
  body{padding-left:92px}
  nav.tabs{top:0;bottom:0;right:auto;width:92px;flex-direction:column;justify-content:flex-start;gap:6px;padding:calc(env(safe-area-inset-top) + 62px) 8px 12px;border-top:0;border-right:1px solid var(--line)}
  .tab{flex:none;padding:11px 0;font-size:12px}
  header.top{padding-left:18px}
  main{max-width:1100px;padding-bottom:calc(var(--player) + 24px)}
  .player{left:92px;bottom:0}
  .toast{bottom:calc(var(--player) + 18px)}
  .cols{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
  .player:not(.mini) .in2{max-width:none;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1.3fr) minmax(0,1fr);grid-template-rows:auto auto;column-gap:22px;align-items:center}
  .player:not(.mini) .prow{grid-column:1;grid-row:1 / span 2}
  .player:not(.mini) .ctl{grid-column:2;grid-row:1;margin:0;justify-content:center;gap:14px}
  .player:not(.mini) .scrub{grid-column:2;grid-row:2;margin:0}
  .player:not(.mini) .vol{grid-column:3;grid-row:1 / span 2}
  .mrail{max-height:calc(100vh - 64px - var(--player) - 20px)}
}
</style>
</head>

<div class="toast" id="toast"></div>

<script>
"use strict";
// ======================================================================
// Blaupunkt-appen. Upplägget kommer från Tavlan-appen: Skärmen, Musik, Ljus, Larm, Inställningar.
// Allt hänger ihop med Blaupunkt-skärmen, hubben på Pi:n (lampor, Sonos, larm) och Nest Hub.
//   /app        i mobilen (inloggad)       /nestapp   på Nest Hub (styra går, inte ändra)
// ======================================================================
const NEST = location.pathname === "/nestapp";
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
const pad2 = n => String(n).padStart(2, "0");
const ic = (n, cls) => `<svg class="ic${cls ? " " + cls : ""}"><use href="#i-${n}"/></svg>`;
const mmss = s => { s = Math.max(0, Math.round(s || 0)); return Math.floor(s / 60) + ":" + pad2(s % 60); };
const store = { get(k, d){ try { const v = localStorage.getItem("bp." + k); return v == null ? d : JSON.parse(v); } catch(e){ return d; } },
                set(k, v){ try { localStorage.setItem("bp." + k, JSON.stringify(v)); } catch(e){} } };
function toast(t, ms){ const el = $("#toast"); el.textContent = t; el.classList.add("on"); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove("on"), ms || 2200); }
async function send(c){ try { await fetch("/api/send?c=" + encodeURIComponent(c)); } catch(e){ toast("Ingen kontakt med servern"); } }
async function getJ(u){ const r = await fetch(u, { cache:"no-store" }); return r.json(); }
async function postJ(u, d){ const r = await fetch(u, { method:"POST", headers:{ "Content-Type":"application/json" }, body: JSON.stringify(d) }); const j = await r.json().catch(() => ({})); if (!r.ok) throw new Error(j.error || ("fel " + r.status)); return j; }

// ---------- läget ----------
const D = { st:{}, deck:{}, S:{}, rooms:{}, sp:{ connected:false }, wx:null, dep:[], shotAt:0 };
let TAB = NEST ? "skarm" : store.get("tab", "skarm");
let ROOM = store.get("room", "");
const NOW = () => D.rooms[curRoom()] || {};
const curRoom = () => ROOM || (D.st.speakers || [])[0] || "Vardagsrum";
const rooms = () => (D.st.speakers && D.st.speakers.length ? D.st.speakers : ["Vardagsrum"]);
const hubOnline = () => D.st.at && Date.now() / 1000 - D.st.at < 150;

// ---------- flikarna ----------
const TABS = [["skarm","Skärmen","tv"],["musik","Musik","music"],["ljus","Ljus","bulb"],["larm","Larm","alarm"],["inst","Inställningar","gear"]];
$("#tabs").innerHTML = TABS.map(([id, t, i]) => `<button class="tab" data-t="${id}" onclick="showTab('${id}')">${ic(i)}<span>${t}</span></button>`).join("");
function showTab(id){
  TAB = id; if (!NEST) store.set("tab", id);
  document.body.className = document.body.className.replace(/\btab-\S+/g, "").trim() + " tab-" + id + (document.body.classList.contains("idle") ? " idle" : "");
  document.querySelectorAll(".tab").forEach(b => b.classList.toggle("on", b.dataset.t === id));
  document.querySelectorAll(".panel").forEach(p => p.classList.toggle("on", p.id === "p-" + id));
  $("#ttl").textContent = "";
  layoutPlayer();
  if (id === "musik"){ send("sonos-focus:" + curRoom()); renderMusic(); }
  if (id === "skarm"){ shotTick(true); renderSkarm(); }
  if (id === "ljus"){ send("lamps-read"); renderLjus(); }
  if (id === "larm") renderLarm();
  if (id === "inst") renderInst();
  window.scrollTo(0, 0);
}
function layoutPlayer(){
  const pl = $("#player");
  const h = TAB === "musik" ? pl.getBoundingClientRect().height : 0;
  document.documentElement.style.setProperty("--player", (h || 0) + "px");
}
window.addEventListener("resize", layoutPlayer);

// ---------- hämtning ----------
let busyUntil = 0;                         // någon drar i ett reglage: rita inte om under tiden
const busy = (ms = 2500) => { busyUntil = Date.now() + ms; };
async function tick(){
  if (document.hidden) return;
  try {
    const [st, rm] = await Promise.all([getJ("/api/tradfri-list"), getJ("/api/sonos-rooms")]);
    D.st = st || {}; D.rooms = rm || {};
  } catch(e){}
  const hub = $("#hub"); hub.classList.toggle("ok", !!hubOnline()); hub.title = hubOnline() ? "Hubben är ansluten" : "Ingen kontakt med hubben";
  document.querySelector('.tab[data-t="larm"]').classList.toggle("alert", ringing().length > 0);
  if (NEST && ringing().length && document.body.classList.contains("idle")){ wake(); showTab("larm"); }
  updatePlayer();
  if (Date.now() < busyUntil) return;
  if (TAB === "ljus") renderLjus();
  if (TAB === "larm") renderLarm(true);
  if (TAB === "skarm") renderSkarmLive();
}
async function slow(){
  try { const j = await getJ("/api/deck"); D.deck = (j && j.deck) || {}; } catch(e){}
  try { const j = await getJ("/api/state"); D.S = (j && j.settings) || {}; } catch(e){}
  try { D.sp = await getJ("/api/sp/status"); } catch(e){}
  if (!ROOM) ROOM = D.S.clipRoom || "";
  if (TAB === "inst") renderInst();
}
async function saveDeck(part){
  if (NEST){ toast("Ändra det här i appen i mobilen"); return false; }
  try { await postJ("/api/deck-patch", part); return true; }
  catch(e){ toast(String(e.message).includes("inloggning") ? "Logga in igen i mobilen" : "Kunde inte spara: " + e.message, 3500); return false; }
}

// ======================================================================
// SKÄRMEN: bild av Blaupunkt-skärmen, snabbkontroller, Stream Controller
// ======================================================================
const PAGES = [["hem","Hemskärm","home"],["wx","Väder","sun"],["news","Nyheter","news"],["foto","Foton","image"],["fotboll","Fotboll","ball"],["hockey","Hockey","ball"],["plex","Film","film"],["test","Testbild","tv"]];
const VIZ = { 1:"Oscilloskop", 2:"Magiskt öga", 3:"VU-mätare", 4:"Atomålder", 5:"Ljusorgel", 6:"Spegel", 7:"Båge", 8:"Fjäril" };
const PALS = { svartvit:"Svartvit", sepia:"Sepia", fosfor:"Grön fosfor", farg:"60-talsfärg" };
let shotT = 0;
async function shotTick(now){
  clearTimeout(shotT);
  if (TAB === "skarm" && !document.hidden){
    send("screen-shot");
    try { const m = await getJ("/api/screenshot?meta=1"); if (m.at && m.at !== D.shotAt){ D.shotAt = m.at; const img = $("#shotImg"); if (img){ img.src = "/api/screenshot?t=" + m.at; } } } catch(e){}
    renderShotMeta();
  }
  shotT = setTimeout(shotTick, now ? 1500 : 4000);
}
function renderShotMeta(){
  const el = $("#shotMeta"); if (!el) return;
  const age = D.shotAt ? Math.round(Date.now() / 1000 - D.shotAt) : null;
  el.innerHTML = `<span>${age == null ? "Väntar på första bilden…" : age < 8 ? "Live" : "Uppdaterad för " + (age < 120 ? age + " s" : Math.round(age / 60) + " min") + " sedan"}</span><span>${hubOnline() ? "" : "Hubben svarar inte"}</span>`;
  const ph = $("#shotPh"); if (ph) ph.classList.toggle("hidden", !!D.shotAt);
}
function renderSkarm(){
  const S = D.S || {};
  const p = $("#p-skarm");
  p.innerHTML = `<div class="cols"><div>
    <div class="card"><div class="lbl">Just nu på skärmen</div>
      <div class="shot" onclick="shotTick(true)"><img id="shotImg" alt="" ${D.shotAt ? `src="/api/screenshot?t=${D.shotAt}"` : ""}><div class="ph" id="shotPh">Hubben tar en bild av Blaupunkt-skärmen medan appen är öppen.</div></div>
      <div class="shotmeta" id="shotMeta"></div>
      <div class="row"><button class="btn big pri" onclick="send('open');toast('Skärmen öppnas')">${ic("power")} Öppna</button><button class="btn big" onclick="send('close');toast('Skärmen stängs')">Stäng</button><button class="btn sq" onclick="send('playpause')" aria-label="Spela/paus">${ic("play")}</button></div>
    </div>
    <div class="card" id="nowCard"></div>
    <div class="card"><div class="lbl">Klipp och sändningar</div>
      <div class="big2">
        <button class="tile" onclick="send('svt:rapport');toast('Rapport startar')">${ic("news")}<span>Rapport<small>senaste sändningen</small></span></button>
        <button class="tile" onclick="send('svt:sportnytt');toast('Sportnytt startar')">${ic("ball")}<span>Sportnytt<small>senaste sändningen</small></span></button>
        <button class="tile" onclick="send('hl:fb');toast('Höjdpunkter fotboll')">${ic("ball")}<span>Höjdpunkter<small>fotboll, SVT</small></span></button>
        <button class="tile" onclick="send('hl:hk');toast('Höjdpunkter hockey')">${ic("ball")}<span>Höjdpunkter<small>hockey</small></span></button>
      </div>
      <div class="row"><button class="btn" onclick="send('hl:stop')">${ic("x")} Stäng klippet</button></div>
    </div>
  </div><div>
    <div class="card"><div class="lbl">Visa sidan</div>
      <div class="big2">${PAGES.map(([k, t, i]) => `<button class="tile" onclick="send('page:${k}');toast('${t}')">${ic(i)}<span>${t}</span></button>`).join("")}</div>
      <div class="row"><button class="btn" onclick="send('page:next')">Nästa sida</button></div>
    </div>
    <div class="card"><div class="lbl">Kanal</div>
      <div class="chips">${Object.entries(VIZ).map(([n, t]) => `<button class="chip${String(S.viz) === n ? " on" : ""}" onclick="setViz(${n})">${t}</button>`).join("")}</div>
      <div class="sub">Färgläge</div>
      <div class="chips">${Object.entries(PALS).map(([k, t]) => `<button class="chip${S.palette === k ? " on" : ""}" onclick="setPal('${k}')">${t}</button>`).join("")}</div>
    </div>

async function sp(path, q){
  const key = path + "?" + new URLSearchParams(q || {});
  if (SPC[key] && Date.now() - SPC[key].t < 60000) return SPC[key].d;
  const j = await getJ("/api/sp/api?" + new URLSearchParams(Object.assign({ path }, q || {})));
  if (j && j.error){ if (j.login) D.sp.connected = false; throw new Error(j.error); }
  SPC[key] = { t: Date.now(), d: j };
  return j;
}

function drawPos(){
  if (scrubbing) return;
  const p = Math.min(posBase.dur || 0, posBase.pos + (posBase.playing ? (Date.now() - posBase.at) / 1000 : 0));
  const f = posBase.dur ? p / posBase.dur * 100 : 0;
  $("#npFill").style.width = f + "%"; $("#npDot").style.left = f + "%";
  $("#npPos").textContent = mmss(p); $("#npLeft").textContent = posBase.dur ? "−" + mmss(posBase.dur - p) : "";
  document.querySelector(".scrub").style.visibility = posBase.dur ? "" : "hidden";
}
setInterval(drawPos, 500);
let scrubbing = false;
(function(){
  const bar = $("#npBar");
  const at = e => { const r = bar.getBoundingClientRect(); return Math.max(0, Math.min(1, (e.clientX - r.left) / r.width)); };
  bar.addEventListener("pointerdown", e => { if (!posBase.dur) return; scrubbing = true; bar.setPointerCapture(e.pointerId); move(e); });
  const move = e => { if (!scrubbing) return; const f = at(e); $("#npFill").style.width = f * 100 + "%"; $("#npDot").style.left = f * 100 + "%"; $("#npPos").textContent = mmss(f * posBase.dur); };
  bar.addEventListener("pointermove", move);
  bar.addEventListener("pointerup", e => { if (!scrubbing) return; scrubbing = false; const s = at(e) * posBase.dur; posBase = Object.assign(posBase, { pos: s, at: Date.now() }); sonos("seek", Math.round(s)); });
  let vt = 0;
  $("#npVol").addEventListener("input", e => { busy(); clearTimeout(vt); vt = setTimeout(() => sonos("vol", +e.target.value), 150); });
})();

// ---------- Spotify-inloggningen (koden byts mot nycklar på servern) ----------
const b64url = buf => btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
async function spLogin(){
  const cid = (D.S.clientId || "").trim();
  if (!cid){ openInst("musik"); toast("Lägg först in Spotify Client ID"); return; }
  const a = new Uint8Array(48); crypto.getRandomValues(a);
  const verifier = Array.from(a, x => "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789"[x % 62]).join("");

    <div class="setrow"><div class="t">Stäng Blaupunkt-skärmen också</div><button class="sw${SSET.screen ? " on" : ""}" onclick="SSET.screen=!SSET.screen;${save}"></button></div>
    <div class="row"><button class="btn pri big" onclick="startSleep()">${ic("moon")} Starta i ${esc(curRoom())}</button></div></div>`;
}
function startSleep(){ send("sleep:" + JSON.stringify(Object.assign({ room: curRoom() }, SSET))); toast("Sov-timern är på"); setTimeout(tick, 1200); closeSheet(); }
function openSleep(){ openSheet(sleepPanel().replace('class="card"', 'class="card" style="border:0;padding:0;background:none"')); }

// ======================================================================
// INSTÄLLNINGAR: meny med sök som i Tavlan. Skärmens inställningar är samma kontroller som
// panelen på Blaupunkt-skärmen (index.html?panel=…) och sparas direkt till alla skärmar.
// ======================================================================
const SETP = [
  ["Blaupunkt-skärmen", [
    ["sidor", "home", "Sidor när inget spelar", "Hemskärm, testbild och hur länge sidorna visas", "idle:hem,idle:test,idle:tider", "hemskärm rotation tid sidor testbild klocka"],
    ["vader", "sun", "Väder, datum och klocka", "Väder i detalj, kanterna runt bilden, steg", "idle:vader,kanter", "väder ort datum klocka vecka steg kanter"],
    ["buss", "bus", "Buss", "Hållplats, destination och skylten", "idle:buss", "buss hållplats avgångar resrobot skylt dalatrafik"],
    ["nyheter", "news", "Nyheter", "Källor och bara innehållsrika artiklar", "idle:nyheter", "nyheter rss källor artiklar"],
    ["sport", "ball", "Fotboll och hockey", "AIK, tabeller och sportnyheter", "idle:sport", "fotboll hockey aik tabell sport highlights"],
    ["plex", "film", "Film från Plex", "Filmtips bland osedda filmer", "idle:plex", "plex film filmtips"],
    ["foton", "image", "Foton", "Album från Google Foto", "idle:foton", "foton google album bilder"],
    ["bildror", "tv", "Bildrör och färg", "Färgläge, mättnad, störningar, uppvärmning", "bildror", "bildrör färg mättnad ljusstyrka kontrast störningar brus flimmer"],
    ["utseende", "text", "Text och utseende", "Märkning, typsnitt, textstorlekar, omslag", "utseende", "text typsnitt storlek märkning omslag versaler"],
    ["skarm", "tv", "Skärmformat", "Format och skärmens mått", "skarm", "skärm format storlek"],
    ["kanal", "wave", "Kanal (visualisering)", "Visualiseringar och byte vid ny låt", "kanal", "kanal visualisering oscilloskop ljusorgel"],
  ]],
  ["Musik och ljud", [
    ["musik", "music", "Musik och Spotify", "Spotify-inloggning, Client ID, källa", "", "spotify musik källa client inloggning"],
    ["radio", "radio", "Radio på skärmen", "Stationer för skärmens radioläge", "radio", "radio stationer"],
    ["skarmljud", "speaker", "Ljud, vakna och belysning", "Klippljud, vakna-läge, Trådfri vid väckning", "kalla,spotify", "klippljud vakna väckning trådfri belysning visualisering ljud"],
  ]],
  ["Hemmet", [
    ["scener", "sparkles", "Scener, tider och lampregler", "Bygg i deck-redigeraren", "", "scener tider schema lampregler"],
    ["knappar", "grid", "Knappar (Stream Controller)", "Knapparnas utseende och funktion", "", "knappar stream controller deck vred"],
    ["nest", "cast", "Nest Hub", "Appen på Nest Hub", "", "nest hub google cast"],
  ]],
  ["System", [
    ["hubb", "hub", "Hubben", "Status för Pi:n", "", "hubb pi status version"],
    ["kort", "grid", "Testa och kortkommandon", "Testa väckningen, tangenter", "kort", "test väckning kortkommandon"],
    ["aterstall", "lock", "Återställ skärmen", "Alla skärmens inställningar", "aterstall", "återställ"],
  ]],
];
let SETPAGE = null, SETQ = "";
const norm = s => String(s || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
function renderInst(){
  const p = $("#p-inst");
  if (SETPAGE) return renderSetPage(p);
  const q = norm(SETQ).trim();
  let html = `<input type="search" class="in" id="setQ" placeholder="Sök inställning… (t.ex. buss, mättnad)" value="${esc(SETQ)}" style="margin-bottom:14px">`;
  const row = ([id, i, t, s]) => `<div class="mrow" onclick="openInst('${id}')"><div class="mico">${ic(i)}</div><div style="min-width:0"><div class="mt">${esc(t)}</div><div class="ms">${esc(s)}</div></div><span class="marrow">›</span></div>`;
  if (q){
    const hits = SETP.flatMap(([sec, rows]) => rows).filter(r => norm(r[2] + " " + r[3] + " " + r[5]).includes(q));
    html += hits.length ? `<div class="menu">${hits.map(row).join("")}</div>` : `<div class="empty">Ingen inställning heter så.</div>`;
  } else html += SETP.map(([sec, rows]) => `<div class="secT">${esc(sec)}</div><div class="menu">${rows.map(row).join("")}</div>`).join("");
  html += NEST ? "" : `<div class="hint" style="text-align:center">Inställningarna sparas direkt och syns på alla skärmar.</div>`;
  p.innerHTML = html;
  const inp = $("#setQ"); inp.addEventListener("input", () => { SETQ = inp.value; const pos = inp.selectionStart; renderInst(); const n = $("#setQ"); n.focus(); n.setSelectionRange(pos, pos); });
}
function openInst(id){ SETPAGE = id; if (TAB !== "inst") showTab("inst"); else renderInst(); window.scrollTo(0, 0); }
function renderSetPage(p){
  const r = SETP.flatMap(([, rows]) => rows).find(x => x[0] === SETPAGE);
  if (!r){ SETPAGE = null; return renderInst(); }
  let body = "";
  if (r[4]) body = NEST ? `<div class="empty">Ändra skärmens inställningar i appen i mobilen.</div>` : `<iframe class="pframe" id="pframe" src="/?panel=${encodeURIComponent(r[4])}" title="${esc(r[2])}"></iframe>`;
  else if (r[0] === "musik") body = `<div class="card"><div class="lbl">Spotify i appen</div>
      ${D.sp.connected ? `<div class="setrow"><div><div class="t">Inloggad${D.sp.name ? " som " + esc(D.sp.name) : ""}</div><div class="s">${D.sp.product === "premium" ? "Premium" : esc(D.sp.product || "")}</div></div>${ic("check")}</div><div class="row"><button class="btn" onclick="spLogout()">Logga ut</button></div>`
        : `<div class="hint">Logga in så hämtar appen dina spellistor, gillade låtar och sök. Musiken spelas på Sonos.</div><div class="row"><button class="btn pri big" onclick="spLogin()">Logga in med Spotify</button></div>`}
      <div class="hint">Samma Spotify-app (Client ID) som Blaupunkt-skärmen använder. Lägg till <b>${esc(location.origin)}/callback</b> som Redirect URI i Spotifys utvecklarsida om den inte redan finns.</div></div>
    <iframe class="pframe" id="pframe" src="/?panel=spotify" title="Spotify"></iframe>`;
  else if (r[0] === "scener" || r[0] === "knappar") body = `<div class="card"><div class="hint">${r[0] === "scener" ? "Scener (ljus, musik, skärm, effekter, tidslinjer), tider och lampregler byggs i deck-redigeraren. Här i appen startar du dem och slår av och på tiderna (fliken Ljus)." : "Knapparnas utseende, funktioner, sidor och vred ställs in i deck-redigeraren. Under fliken Skärmen finns knapparna att trycka på."}</div>
      <div class="row"><a class="btn pri big" href="/deck" target="_blank" rel="noopener">Öppna deck-redigeraren</a></div></div>`;
  else if (r[0] === "nest") body = `<div class="card"><div class="hint">Hubben castar den här appen till Google Nest Hub. Där kan du styra musik, ljus, scener och larm med touch. Efter två minuter utan tryck visas klockvyn.</div>
      <div class="row"><button class="btn pri" onclick="send('nest:now');toast('Castar till Nest Hub')">Visa på Nest Hub nu</button><button class="btn" onclick="send('nest:on');toast('På')">Slå på</button><button class="btn" onclick="send('nest:off');toast('Av')">Slå av</button></div></div>`;
  else if (r[0] === "hubb") body = `<div class="card">
      <div class="setrow"><div class="t">Kontakt</div><div class="mut">${hubOnline() ? "Ansluten" : "Svarar inte"}</div></div>
      <div class="setrow"><div class="t">Senast hörd</div><div class="mut">${D.st.at ? hhmm(D.st.at) : "–"}</div></div>
      <div class="setrow"><div class="t">Lampor</div><div class="mut">${(D.st.lamps || []).length}</div></div>
      <div class="setrow"><div class="t">Högtalare</div><div class="mut">${esc(rooms().join(", "))}</div></div>
      <div class="row"><button class="btn" onclick="send('tradfri-refresh');toast('Läser om lamporna')">Läs om lampor och grupper</button><button class="btn" onclick="send('lamps-read');toast('Läser av')">Läs av nu</button></div>
      <div class="hint">Uppdatera hubben med uppdatera-pi.bat på datorn.</div></div>`;
  p.innerHTML = `<div class="pagehead"><button class="back" onclick="SETPAGE=null;renderInst()">‹</button><div class="pagetitle">${esc(r[2])}</div></div>` + body;
}
window.addEventListener("message", e => { if (e.origin === location.origin && e.data && e.data.panelHeight){ const f = $("#pframe"); if (f) f.style.height = (e.data.panelHeight + 10) + "px"; } });

// ---------- bladet ----------
function openSheet(html){ $("#sheetBody").innerHTML = html; $("#sheetBg").classList.add("on"); $("#sheet").classList.add("on"); }
function closeSheet(){ $("#sheetBg").classList.remove("on"); $("#sheet").classList.remove("on"); }

// ---------- Nest Hub: klockvyn när ingen rört skärmen på två minuter ----------
let idleT = 0;
function wake(){ document.body.classList.remove("idle"); clearTimeout(idleT); idleT = setTimeout(() => { document.body.classList.add("idle"); }, 120000); }
if (NEST){
  const amb = document.createElement("iframe"); amb.id = "amb"; amb.src = "/nest"; amb.tabIndex = -1; document.body.append(amb);
  const cover = document.createElement("div"); cover.id = "ambCover"; document.body.append(cover);
  cover.addEventListener("pointerdown", e => { e.preventDefault(); e.stopPropagation(); wake(); });
  ["pointerdown", "keydown", "wheel"].forEach(ev => document.addEventListener(ev, wake, true));
  wake();
}

// ---------- start ----------
(async () => {
  await spFinish();
  await slow();
  await tick();
  if (D.sp.connected) loadPlaylists().then(() => { if (TAB === "musik") renderRail(); });
  showTab(TAB);
  setInterval(tick, 2500);
  setInterval(slow, 60000);
  setInterval(() => { if (TAB === "musik" || TAB === "skarm") send("sonos-focus:" + curRoom()); }, 30000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden){ tick(); slow(); if (TAB === "skarm") shotTick(true); if (TAB === "musik") send("sonos-focus:" + curRoom()); } });
})();
