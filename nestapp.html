<!doctype html>
<html lang="sv" translate="no">
<head>
<meta charset="utf-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blaupunkt på bordet</title>
<style>
/* Google Nest Hub (1024×600, svag processor): stort, tydligt, inga dyra effekter (ingen oskärpa,
   inga skuggor eller animationer som ritas hela tiden). Allt som trycks visar resultatet direkt. */
:root{--bg:#0d0e10;--card:#18191c;--card2:#222428;--line:#2c2f34;--tx:#f2efe8;--mut:#a3a6ad;--dim:#6b6f77;--acc:#f0a63a;--ink:#1a1204;--ok:#34c759;--bad:#ff5a4f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--tx);font-family:"Segoe UI",Roboto,system-ui,Arial,sans-serif}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
svg.ic{width:1em;height:1em;flex:none}
#app{position:absolute;inset:0;display:flex}
/* vänsterlisten */
#rail{width:112px;flex:none;display:flex;flex-direction:column;gap:6px;padding:12px 10px;background:#121315;border-right:1px solid var(--line)}
.rb{height:84px;border-radius:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--mut);font-size:15px;font-weight:700;position:relative}
.rb svg{font-size:32px}
.rb.on{background:var(--acc);color:var(--ink)}
.rb.alert::after{content:"";position:absolute;top:12px;right:22px;width:14px;height:14px;border-radius:50%;background:var(--bad)}
#main{flex:1;min-width:0;position:relative}
.view{position:absolute;inset:0;padding:18px 20px;display:none;overflow-y:auto;overflow-x:hidden}
.view.on{display:block}
body.mini .view.withbar{bottom:96px}
/* gemensamt */
.press{transition:transform .08s}
.press:active,.press.down{transform:scale(.94);filter:brightness(1.25)}
.card{background:var(--card);border-radius:24px;padding:18px}
.h{font-size:15px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--acc);margin:0 0 12px}
.big{font-size:28px;font-weight:750;line-height:1.15}
.mut{color:var(--mut)}
.toast{position:absolute;left:50%;top:18px;transform:translateX(-50%);background:#2b2e33;color:var(--tx);font-size:22px;font-weight:700;padding:14px 26px;border-radius:18px;z-index:50;display:none;max-width:80%;text-align:center}
.toast.on{display:block}
.btn{min-height:76px;border-radius:20px;background:var(--card2);font-size:22px;font-weight:750;display:flex;align-items:center;justify-content:center;gap:12px;padding:0 22px}
.btn svg{font-size:30px}
.btn.pri{background:var(--acc);color:var(--ink)}
.btn.on{background:var(--acc);color:var(--ink)}
.btn.bad{background:#3a1715;color:#ffb3ad}
.row{display:flex;gap:12px}
.row > *{flex:1}
.empty{color:var(--mut);font-size:20px;text-align:center;padding:40px 20px}
/* tjock skjutreglage som går att träffa med fingret */
.bar{position:relative;height:72px;border-radius:20px;background:var(--card2);overflow:hidden;touch-action:none}
.bar i{position:absolute;left:0;top:0;bottom:0;background:#4a3a22}
.bar.lit i{background:#a8691f}
.bar span{position:absolute;inset:0;display:flex;align-items:center;justify-content:space-between;padding:0 22px;font-size:22px;font-weight:750;pointer-events:none}
.bar span b:last-child{font-variant-numeric:tabular-nums}
/* ---- Hem ---- */
.home{display:grid;grid-template-columns:330px 1fr;gap:18px;height:100%}
.clock{font-size:84px;font-weight:800;line-height:.95;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.date{font-size:22px;color:var(--mut);margin-top:8px;text-transform:capitalize}
.wx{display:flex;align-items:center;gap:14px;margin-top:14px;font-size:20px}
.wx svg{font-size:52px;color:var(--acc)}
.wx b{font-size:40px}
.info{margin-top:14px;display:flex;flex-direction:column;gap:8px;max-height:330px;overflow-y:auto}
.pill{display:flex;align-items:center;gap:12px;min-height:56px;padding:0 18px;border-radius:18px;background:var(--card);font-size:19px;font-weight:650;text-align:left}
.pill svg{font-size:26px;color:var(--acc)}
.pill.hot{background:#3a2a12}
.np{display:flex;flex-direction:column;height:100%}
.nptop{display:flex;gap:20px;align-items:center}
.cov{width:200px;height:200px;border-radius:20px;background:var(--card2);flex:none;overflow:hidden;display:flex;align-items:center;justify-content:center;color:var(--dim);font-size:64px}
.cov img{width:100%;height:100%;object-fit:cover}
.npT{font-size:32px;font-weight:800;line-height:1.12;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.npA{font-size:22px;color:var(--mut);margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.npR{display:inline-flex;align-items:center;gap:8px;margin-top:14px;font-size:20px;font-weight:750;color:var(--acc);background:var(--card2);border-radius:16px;padding:12px 18px}
.ctl{display:flex;align-items:center;justify-content:center;gap:26px;margin:18px 0 14px}
.cb{width:92px;height:92px;border-radius:50%;background:var(--card2);display:flex;align-items:center;justify-content:center;font-size:40px}
.cb.play{width:118px;height:118px;background:var(--acc);color:var(--ink);font-size:52px}
.volrow{display:flex;gap:12px;align-items:center;margin-top:auto}
.vb{width:84px;height:72px;border-radius:20px;background:var(--card2);font-size:40px;font-weight:700;flex:none;display:flex;align-items:center;justify-content:center}
/* ---- rutnät ---- */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.tile{min-height:150px;border-radius:24px;background:var(--card);display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;padding:20px;text-align:left}
.tile svg{font-size:42px;color:var(--acc)}
.tile b{font-size:24px;font-weight:750;line-height:1.15}
.tile small{display:block;font-size:16px;font-weight:600;opacity:.75;margin-top:4px}
.tile.on{background:var(--acc);color:var(--ink)}
.tile.on svg{color:var(--ink)}
.tile.wait{opacity:.6}
/* ---- Musik ---- */
.seg{display:flex;gap:10px;margin-bottom:14px}
.seg button{height:60px;border-radius:18px;background:var(--card);font-size:20px;font-weight:750;padding:0 24px}
.seg button.on{background:var(--acc);color:var(--ink)}
.covers{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.cv{text-align:left}
.cv .im{width:100%;aspect-ratio:1;border-radius:18px;background:var(--card2);overflow:hidden;display:flex;align-items:center;justify-content:center;color:var(--dim);font-size:56px}
.cv .im img{width:100%;height:100%;object-fit:cover}
.cv b{display:block;font-size:18px;font-weight:700;margin-top:8px;line-height:1.2;max-height:2.4em;overflow:hidden}
.list{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.li{min-height:80px;border-radius:20px;background:var(--card);display:flex;align-items:center;gap:16px;padding:0 20px;font-size:21px;font-weight:700;text-align:left}
.li svg{font-size:30px;color:var(--acc)}
.li img{width:52px;height:52px;border-radius:10px;object-fit:cover;flex:none}
/* mini-spelaren längst ned */
#mini{position:absolute;left:112px;right:0;bottom:0;height:96px;background:#16171a;border-top:1px solid var(--line);display:none;align-items:center;gap:14px;padding:0 16px}
body.mini #mini{display:flex}
#mini .mc{width:68px;height:68px;border-radius:14px;background:var(--card2);overflow:hidden;flex:none;display:flex;align-items:center;justify-content:center;color:var(--dim);font-size:30px}
#mini .mc img{width:100%;height:100%;object-fit:cover}
#mini .mt{flex:1;min-width:0}
#mini .mt b{display:block;font-size:21px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#mini .mt span{font-size:16px;color:var(--mut)}
#mini .cb{width:72px;height:72px;font-size:32px}
#mini .cb.play{width:80px;height:80px;font-size:36px}
#mini .vb{width:68px;height:68px;font-size:34px}
/* sök och tangentbord */
.sbox{display:flex;gap:10px;margin-bottom:10px}
.sq{flex:1;height:64px;border-radius:18px;background:var(--card2);display:flex;align-items:center;padding:0 20px;font-size:26px;font-weight:700;overflow:hidden;white-space:nowrap}
.sclr{width:64px;height:64px;border-radius:18px;background:var(--card2);font-size:26px;display:flex;align-items:center;justify-content:center}
.kb{display:flex;flex-direction:column;gap:7px;margin-bottom:14px}
.kr{display:flex;gap:7px;justify-content:center}
.kr button{flex:1;max-width:70px;height:58px;border-radius:14px;background:var(--card2);font-size:24px;font-weight:700}
.kr button.wide{max-width:none;flex:4;font-size:18px}
.kr button.go{max-width:none;flex:2;background:var(--acc);color:var(--ink);font-size:20px}
/* ---- TV ---- */
.chan{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.ch{min-height:170px;border-radius:24px;display:flex;flex-direction:column;justify-content:space-between;padding:20px;text-align:left;color:#fff;position:relative;overflow:hidden}
.ch img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.35}
.ch b{position:relative;font-size:34px;font-weight:800;line-height:1}
.ch small{position:relative;font-size:18px;font-weight:650;line-height:1.25;opacity:.92;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ch .live{position:relative;align-self:flex-start;font-size:14px;font-weight:800;letter-spacing:.12em;background:rgba(0,0,0,.35);border-radius:10px;padding:5px 10px}
.segs{display:flex;gap:10px;margin-bottom:14px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.segs::-webkit-scrollbar{display:none}
.segs button{flex:none;height:60px;border-radius:18px;background:var(--card);font-size:20px;font-weight:750;padding:0 24px}
.segs button.on{background:var(--acc);color:var(--ink)}
.posters{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}
.po{text-align:left}
.po .im{width:100%;aspect-ratio:2/3;border-radius:16px;background:var(--card2);overflow:hidden;display:flex;align-items:center;justify-content:center;color:var(--dim);font-size:48px;position:relative}
.po .im img{width:100%;height:100%;object-fit:cover}
.po .im i{position:absolute;right:8px;top:8px;width:16px;height:16px;border-radius:50%;background:var(--acc);border:2px solid #000}
.po b{display:block;font-size:17px;font-weight:700;margin-top:7px;line-height:1.2;max-height:2.4em;overflow:hidden}
.po span{font-size:15px;color:var(--mut)}
.det{display:flex;gap:22px}
.det .pimg{width:210px;flex:none;aspect-ratio:2/3;border-radius:18px;overflow:hidden;background:var(--card2)}
.det .pimg img{width:100%;height:100%;object-fit:cover}
.det p{font-size:19px;line-height:1.4;color:#d8d5ce;max-height:9.8em;overflow-y:auto;margin:10px 0 16px}
/* ---- Ljus ---- */
.groups{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grp{background:var(--card);border-radius:24px;padding:18px;display:flex;flex-direction:column;gap:14px}
.gh{display:flex;align-items:center;gap:14px}
.gh b{flex:1;font-size:26px}
.tog{width:104px;height:60px;border-radius:30px;background:#3a3d43;position:relative;flex:none}
.tog::after{content:"";position:absolute;top:6px;left:6px;width:48px;height:48px;border-radius:50%;background:#e9e9ec;transition:left .12s}
.tog.on{background:var(--ok)}.tog.on::after{left:50px}
.temps{display:flex;gap:10px}
.temps button{flex:1;height:60px;border-radius:16px;font-size:18px;font-weight:750;color:#1a1204}
.moods{display:flex;flex-wrap:wrap;gap:10px}
.moods button{height:56px;border-radius:16px;background:var(--card2);font-size:18px;font-weight:700;padding:0 18px}
/* ---- Larm ---- */
.alarmgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.alm{display:flex;align-items:center;justify-content:space-between;min-height:84px;border-radius:20px;background:var(--card);padding:0 20px;margin-bottom:10px}
.alm b{font-size:40px;font-variant-numeric:tabular-nums}
.alm span{font-size:17px;color:var(--mut)}
.alm.off{opacity:.45}
.qgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.qgrid button{height:74px;border-radius:18px;background:var(--card2);font-size:22px;font-weight:750}
.count{font-size:54px;font-weight:800;font-variant-numeric:tabular-nums}
/* ---- bladet (rum, färger) ---- */
#sheet{position:absolute;inset:0;background:rgba(0,0,0,.6);z-index:40;display:none;align-items:flex-end;justify-content:center}
#sheet.on{display:flex}
#sheet .in{width:100%;max-width:900px;background:#17181b;border-radius:28px 28px 0 0;padding:22px 24px 26px;max-height:92%;overflow-y:auto}
#sheet h2{margin:0 0 16px;font-size:28px}
.swatches{display:grid;grid-template-columns:repeat(6,1fr);gap:14px}
.swatches button{height:90px;border-radius:22px}
/* ---- larmet ringer / vila ---- */
#ring{position:absolute;inset:0;z-index:60;background:#1c1208;display:none;flex-direction:column;align-items:center;justify-content:center;gap:24px;padding:30px}
#ring.on{display:flex}
#ring .t{font-size:110px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
#ring .n{font-size:30px;color:var(--mut)}
#ring .row{width:100%;max-width:820px}
#ring .btn{min-height:130px;font-size:34px;border-radius:30px}
#idle{position:absolute;inset:0;z-index:55;background:#070707;display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px}
#idle.on{display:flex}
#idle .c{font-size:180px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums;color:#e8e2d4}
#idle .d{font-size:28px;color:#8c8a84;text-transform:capitalize}
/* markören från handkontrollen */
.kf{outline:5px solid #fff !important;outline-offset:3px;z-index:3;position:relative}
.bar.kf{outline-color:var(--acc) !important}
#idle .s{font-size:24px;color:#8c8a84;margin-top:24px;max-width:80%;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
body.night #idle .c{color:#7a756b}
body.night #idle .d,body.night #idle .s{color:#55534f}
</style>
</head>

<div id="app">
  <nav id="rail"></nav>
  <div id="main">
    <section class="view" id="v-hem"></section>
    <section class="view withbar" id="v-musik"></section>
    <section class="view withbar" id="v-tv"></section>
    <section class="view withbar" id="v-ljus"></section>
    <section class="view withbar" id="v-scener"></section>
    <section class="view withbar" id="v-larm"></section>
  </div>
</div>
<div id="mini">
  <div class="mc" id="mCov"></div>
  <div class="mt" data-tap="go('hem')"><b id="mT">Inget spelas</b><span id="mA"></span></div>
  <button class="cb press" data-tap="sonos('prev')"><svg class="ic"><use href="#i-prev"/></svg></button>
  <button class="cb play press" id="mPP" data-tap="playPause()"></button>
  <button class="cb press" data-tap="sonos('next')"><svg class="ic"><use href="#i-next"/></svg></button>
  <button class="vb press" data-tap="volStep(-4)">−</button>
  <button class="vb press" data-tap="volStep(4)">+</button>
</div>
<div id="sheet" onclick="if(event.target===this)closeSheet()"><div class="in" id="sheetIn"></div></div>
<div id="ring"><div class="t" id="ringT"></div><div class="n" id="ringN"></div><div class="row"><button class="btn press" id="ringSn">Snooza</button><button class="btn pri press" id="ringOff">Stäng av</button></div></div>
<div id="idle"><div class="c" id="iC"></div><div class="d" id="iD"></div><div class="s" id="iS"></div></div>
<div class="toast" id="toast"></div>

<script>
"use strict";
// Blaupunkt på bordet: appen för Google Nest Hub (castad hit av hubben, se hub/nestcast.py och
// hacast.py). Sex delar: Hem, Musik, TV, Ljus, Scener, Larm. Bara styrning; inställningar görs i mobilen.
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
const ic = n => `<svg class="ic"><use href="#i-${n}"/></svg>`;
const pad2 = n => String(n).padStart(2, "0");
const store = { get(k, d){ try { const v = localStorage.getItem("nh." + k); return v == null ? d : JSON.parse(v); } catch(e){ return d; } }, set(k, v){ try { localStorage.setItem("nh." + k, JSON.stringify(v)); } catch(e){} } };
function toast(t){ const el = $("#toast"); el.textContent = t; el.classList.add("on"); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove("on"), 1800); }
function send(c){ fetch("/api/send?c=" + encodeURIComponent(c), { keepalive: true }).catch(() => toast("Ingen kontakt")); clearTimeout(send.t); send.t = setTimeout(() => poll(), 700); }
const getJ = u => fetch(u, { cache:"no-store" }).then(r => r.json());

const D = { st:{}, rooms:{}, deck:{}, S:{}, wx:null, pls:[], sp:false, radio:[] };
let VIEW = "hem", ROOM = store.get("room", "");
const rooms = () => (D.st.speakers && D.st.speakers.length ? D.st.speakers : ["Vardagsrum"]);
const room = () => ROOM || D.S.clipRoom || rooms()[0];
const NOW = () => D.rooms[room()] || {};
// det användaren just tryckt på gäller tills hubben hunnit svara (så att inget hoppar tillbaka)
const HOLD = {};
const hold = (k, v, ms) => { HOLD[k] = { v, until: Date.now() + (ms || 4000) }; };
const held = (k, real) => (HOLD[k] && Date.now() < HOLD[k].until) ? HOLD[k].v : real;

// ---------- vänsterlisten ----------
const VIEWS = [["hem","Hem","home"],["musik","Musik","music"],["tv","TV","tv"],["ljus","Ljus","bulb"],["scener","Scener","spark"],["larm","Larm","alarm"]];
$("#rail").innerHTML = VIEWS.map(([k, t, i]) => `<button class="rb press" data-v="${k}" data-tap="go('${k}')">${ic(i)}<span>${t}</span></button>`).join("");
function go(v){
  VIEW = v;
  document.querySelectorAll(".rb").forEach(b => b.classList.toggle("on", b.dataset.v === v));
  document.querySelectorAll(".view").forEach(x => x.classList.toggle("on", x.id === "v-" + v));
  document.body.classList.toggle("mini", v !== "hem");
  if (v === "ljus") send("lamps-read");
  if (v === "tv") tvLoad();
  render(true);
  $("#v-" + v).scrollTop = 0;
}

// ---------- spela på Sonos ----------
function sonos(action, value, r){ send("sonos:" + JSON.stringify({ room: r || room(), action, value })); }
function playPause(){ const p = !held("play", !!NOW().playing); hold("play", p); sonos("toggle"); paintPlayer(); }
function volStep(d){ const v = Math.max(0, Math.min(100, held("vol", NOW().vol ?? 20) + d)); hold("vol", v); sonos("vol", v); paintPlayer(); }
function setVol(v){ hold("vol", v); clearTimeout(setVol.t); setVol.t = setTimeout(() => sonos("vol", v), 120); }
function playLink(link, name){ sonos("link", { link, index: 0 }); hold("play", true); toast("Spelar " + name); paintPlayer(); }
function playFav(name){ sonos("fav", name); hold("play", true); toast("Spelar " + name); paintPlayer(); }
function playRadio(i){ const s = D.radio[i]; if (!s) return; sonos("radio", { url: s.url, name: s.name }); hold("play", true); toast(s.name); paintPlayer(); }

// ---------- tjockt reglage ----------
function bar(id, val, label, off){
  return `<div class="bar${val > 0 && !off ? " lit" : ""}" id="${id}" data-v="${val}"><i style="width:${val}%"></i><span><b>${label}</b><b>${val} %</b></span></div>`;
}
function wireBar(id, onSet){
  const el = document.getElementById(id); if (!el) return;
  const setV = (v, done) => { v = Math.max(1, Math.min(100, Math.round(v)));
    el.querySelector("i").style.width = v + "%"; el.querySelector("span b:last-child").textContent = v + " %"; el.classList.add("lit"); el.dataset.v = v; onSet(v, done); };
  el._step = d => setV((+el.dataset.v || 0) + d, true);          // handkontrollen: vänster/höger på reglaget
  const set = (e, done) => { const r = el.getBoundingClientRect(); setV((e.clientX - r.left) / r.width * 100, done); };
  el.addEventListener("pointerdown", e => { el.setPointerCapture(e.pointerId); el._drag = true; set(e); });
  el.addEventListener("pointermove", e => { if (el._drag) set(e); });
  el.addEventListener("pointerup", e => { el._drag = false; set(e, true); });
}

// ---------- ritning: varje vy byggs om bara när något har ändrats ----------
const sig = {};
// Ett finger på skärmen: rita inte om något (en knapp som byts ut mitt i trycket tappar trycket).
let touching = false, lastTouch = 0, pendingRender = false;
document.addEventListener("pointerdown", e => { touching = true; const b = e.target.closest(".press"); if (b){ b.classList.add("down"); } }, true);
const lift = () => { touching = false; lastTouch = Date.now(); document.querySelectorAll(".down").forEach(x => x.classList.remove("down"));
  if (pendingRender){ pendingRender = false; setTimeout(() => render(), 450); } };
document.addEventListener("pointerup", lift, true);
document.addEventListener("pointercancel", lift, true);
// tryck reagerar på "pointerup" direkt i stället för att vänta på webbläsarens "click"
document.addEventListener("pointerup", e => {
  const b = e.target.closest("[data-tap]"); if (!b || b._moved) return;
  e.preventDefault(); (0, eval)(b.dataset.tap);
}, true);
document.addEventListener("pointerdown", e => { const b = e.target.closest("[data-tap]"); if (b){ b._moved = false; b._x = e.clientX; b._y = e.clientY; } }, true);
document.addEventListener("pointermove", e => { const b = e.target.closest("[data-tap]"); if (b && (Math.abs(e.clientX - b._x) > 14 || Math.abs(e.clientY - b._y) > 14)) b._moved = true; }, true);
function render(force){
  paintPlayer(); paintRing();
  if (!force && (touching || Date.now() - lastTouch < 450)){ pendingRender = true; return; }
  const f = { hem: rHem, musik: rMusik, tv: rTv, ljus: rLjus, scener: rScener, larm: rLarm }[VIEW];
  const s = f.sig ? f.sig() : "";
  if (!force && sig[VIEW] === s) return;
  if (document.querySelector(".bar") && document.querySelector(".bar")._drag) return;
  sig[VIEW] = s; f();
}
// Hem
function wxIcon(c, day){ return c <= 1 ? (day ? "sun" : "moon") : c <= 48 ? "cloud" : (c >= 71 && c <= 77) || c === 85 || c === 86 ? "snow" : "rain"; }
const WXT = c => c===0?"Klart":c===1?"Mest klart":c===2?"Halvklart":c===3?"Mulet":(c===45||c===48)?"Dimma":(c>=51&&c<=67)?"Regn":(c>=71&&c<=77)?"Snö":(c>=80&&c<=82)?"Regnskurar":(c>=85&&c<=86)?"Snöbyar":c>=95?"Åska":"";
function hhmm(ts){ const d = new Date(ts * 1000); return pad2(d.getHours()) + ":" + pad2(d.getMinutes()); }
const sceneRuns = () => (D.st.runs || []).filter(r => !r.alarm && D.st.runsAt && Date.now() / 1000 - D.st.runsAt < 150);
function nextAlarm(){
  const ids = new Set((D.deck.alarms || []).filter(a => a.on !== false).map(a => "alarm-" + a.id));
  return [...Object.entries(D.st.snoozed || {}).map(([id, at]) => ({ id, at, sn: true })), ...(D.st.upcoming || []).filter(u => ids.has(String(u.id)))].sort((a, b) => a.at - b.at)[0];
}
const sleepOn = () => D.st.sleep && D.st.sleep.end * 1000 > Date.now() ? D.st.sleep : null;
const timers = () => (D.st.timers || []).filter(t => t.end * 1000 > Date.now());
rHem.sig = () => JSON.stringify([D.wx, nextAlarm(), sleepOn(), timers().map(t => t.id), sceneRuns().map(r => r.id), room(), Math.floor(Date.now() / 60000)]);
function rHem(){
  const d = new Date(), w = D.wx, na = nextAlarm(), sl = sleepOn(), tm = timers(), runs = sceneRuns();
  $("#v-hem").innerHTML = `<div class="home"><div>
      <div class="clock">${pad2(d.getHours())}:${pad2(d.getMinutes())}</div>
      <div class="date">${d.toLocaleDateString("sv-SE", { weekday:"long", day:"numeric", month:"long" })}</div>
      ${w ? `<div class="wx">${ic(wxIcon(w.c, w.day))}<div><b>${Math.round(w.t)}°</b><div class="mut">${WXT(w.c)} · ${Math.round(w.hi)}° / ${Math.round(w.lo)}°</div></div></div>` : ""}
      <div class="info">
        <button class="pill press" data-tap="go('larm')">${ic("alarm")}<span>${na ? (na.sn ? "Snoozat till " : "Larm ") + hhmm(na.at) : "Inget larm på"}</span></button>
        ${sl ? `<button class="pill hot press" data-tap="go('larm')">${ic("moon")}<span>Tystnar ${hhmm(sl.end)}</span></button>` : ""}
        ${tm.map(t => `<button class="pill hot press" data-tap="go('larm')">${ic("timer")}<span>${esc(t.name)} <b class="cd" data-end="${t.end}"></b></span></button>`).join("")}
        ${runs.length ? `<button class="pill hot press" data-tap="go('scener')">${ic("spark")}<span>${runs.map(r => esc(r.name)).join(", ")}</span></button>` : ""}
        <button class="pill press" id="bpBtn" data-tap="bpToggle()">${ic("tv")}<span>Blaupunkt-skärmen</span></button>
      </div></div>
    <div class="np card">
      <div class="nptop"><div class="cov" id="hCov"></div><div style="min-width:0;flex:1"><div class="npT" id="hT"></div><div class="npA" id="hA"></div>
        <button class="npR press" data-tap="openRooms()">${ic("speaker")}<span id="hR"></span></button></div></div>
      <div class="ctl"><button class="cb press" data-tap="sonos('prev')">${ic("prev")}</button><button class="cb play press" id="hPP" data-tap="playPause()"></button><button class="cb press" data-tap="sonos('next')">${ic("next")}</button></div>
      <div class="volrow"><button class="vb press" data-tap="volStep(-4)">−</button><div style="flex:1" id="hVolW"></div><button class="vb press" data-tap="volStep(4)">+</button></div>
    </div></div>`;
  paintPlayer(true); tickCountdowns();
}
let bpOpen = store.get("bp", true);
function bpToggle(){ bpOpen = !bpOpen; store.set("bp", bpOpen); send(bpOpen ? "open" : "close"); toast(bpOpen ? "Blaupunkt-skärmen öppnas" : "Blaupunkt-skärmen stängs"); }
// spelaren (Hem och mini-raden): målas om var gång, utan att bygga om något
let lastPaint = "";
function paintPlayer(force){
  const n = NOW(), playing = held("play", !!n.playing), vol = held("vol", n.vol ?? 20);
  const title = n.title || (n.kind === "tv" ? "TV-ljud" : playing ? "Spelar" : "Inget spelas");
  const artist = n.artist || (n.title ? n.album : "Välj musik under Musik");
  const s = [title, artist, n.art, playing, vol, room(), (n.members || []).length].join("|");
  if (!force && s === lastPaint) return; lastPaint = s;
  const cov = n.art ? `<img src="${esc(n.art)}" alt="">` : ic("music");
  const pp = ic(playing ? "pause" : "play");
  const set = (id, html, text) => { const el = document.getElementById(id); if (el){ if (text) el.textContent = html; else el.innerHTML = html; } };
  set("hCov", cov); set("hT", title, 1); set("hA", artist, 1); set("hPP", pp); set("hR", room() + ((n.members || []).length > 1 ? " + " + (n.members.length - 1) : ""), 1);
  set("mCov", cov); set("mT", title, 1); set("mA", artist + " · " + room(), 1); set("mPP", pp);
  const vw = $("#hVolW");
  if (vw && !(vw.firstChild && vw.firstChild._drag)){ vw.innerHTML = bar("hVol", vol, "Volym"); wireBar("hVol", v => setVol(v)); }
}
// Musik
let MTAB = store.get("mtab", "pl");
rMusik.sig = () => JSON.stringify([MTAB, D.pls.map(p => p.id), ((D.st.sonos || {}).favs || []), D.radio.length, D.sp]);
function rMusik(){
  const favs = (D.st.sonos || {}).favs || [];
  let body = "";
  if (MTAB === "sok"){ rSearch(); return; }
  if (MTAB === "pl"){
    body = !D.sp ? `<div class="empty">Logga in med Spotify i appen i mobilen (Musik), så kommer dina spellistor hit.</div>`
      : `<div class="covers">${D.pls.map((p, i) => `<button class="cv press" data-tap="playPl(${i})"><div class="im">${p.img ? `<img src="${esc(p.img)}" alt="" loading="lazy">` : ic("music")}</div><b>${esc(p.name)}</b></button>`).join("")}</div>`;
  } else if (MTAB === "fav"){
    body = favs.length ? `<div class="list">${favs.map((f, i) => `<button class="li press" data-tap="playFav(${JSON.stringify(f).replace(/"/g, "&quot;")})">${ic("star")}<span>${esc(f)}</span></button>`).join("")}</div>` : `<div class="empty">Sonos-favoriterna kommer när hubben läst av högtalarna.</div>`;
  } else {
    body = D.radio.length ? `<div class="list">${D.radio.map((s, i) => `<button class="li press" data-tap="playRadio(${i})">${s.icon ? `<img src="${esc(s.icon)}" alt="" loading="lazy" onerror="this.remove()">` : ic("radio")}<span>${esc(s.name)}</span></button>`).join("")}</div>` : `<div class="empty">Hämtar radiostationer…</div>`;
    if (!D.radio.length) loadRadio();
  }
  $("#v-musik").innerHTML = `<div class="seg">${[["pl","Spellistor"],["sok","Sök"],["fav","Favoriter"],["radio","Radio"]].map(([k, t]) => `<button class="press${MTAB === k ? " on" : ""}" data-tap="MTAB='${k}';store.set('mtab','${k}');render(true)">${t}</button>`).join("")}
    <button class="press" style="margin-left:auto" data-tap="openRooms()">${ic("speaker")} ${esc(room())}</button></div>${body}`;
}
// ---------- Sök på Spotify: eget tangentbord (Nest Hub har inget för webbsidor) ----------
let SQ = "", SRES = null, SBUSY = false, SKB = true;
const KB = ["qwertyuiopå", "asdfghjklöä", "zxcvbnm"];
function rSearch(){
  const res = SRES;
  const row = (it, i) => `<button class="li press" data-tap="playRes(${i})">${it.img ? `<img src="${esc(it.img)}" alt="" loading="lazy">` : ic(it.kind === "artist" ? "speaker" : "music")}<span style="min-width:0"><span style="display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(it.name)}</span><span style="display:block;font-size:15px;color:var(--mut);font-weight:600">${esc(it.sub)}</span></span></button>`;
  $("#v-musik").innerHTML = `<div class="seg">${[["pl","Spellistor"],["sok","Sök"],["fav","Favoriter"],["radio","Radio"]].map(([k, t]) => `<button class="press${MTAB === k ? " on" : ""}" data-tap="MTAB='${k}';store.set('mtab','${k}');render(true)">${t}</button>`).join("")}</div>
    <div class="sbox"><div class="sq press" id="sq" data-tap="SKB=true;rSearch()">${esc(SQ) || '<span class="mut">Skriv vad du söker…</span>'}</div><button class="press sclr" data-tap="SQ='';SRES=null;rSearch()">${ic("x")}</button></div>
    <div class="kb"${SKB ? "" : ' style="display:none"'}>${KB.map(r => `<div class="kr">${[...r].map(k => `<button class="press" data-tap="key('${k}')">${k}</button>`).join("")}</div>`).join("")}
      <div class="kr"><button class="press wide" data-tap="key(' ')">mellanslag</button><button class="press" data-tap="key('<')">⌫</button><button class="press go" data-tap="doSearch()">Sök</button></div></div>
    <div id="sres">${SBUSY ? '<div class="empty">Söker…</div>' : res ? (res.length ? `<div class="list">${res.map(row).join("")}</div>` : '<div class="empty">Inga träffar.</div>') : ""}</div>`;
}
function key(k){ SQ = k === "<" ? SQ.slice(0, -1) : (SQ + k).slice(0, 40); const el = $("#sq"); if (el) el.innerHTML = esc(SQ) || '<span class="mut">Skriv vad du söker…</span>'; clearTimeout(key.t); if (SQ.length >= 3) key.t = setTimeout(doSearch, 900); }
async function doSearch(){
  if (!SQ.trim()) return;
  if (!D.sp){ toast("Logga in med Spotify i mobilen först"); return; }
  SBUSY = true; rSearch();
  try {
    const j = await getJ("/api/sp/api?" + new URLSearchParams({ path:"search", q: SQ.trim(), type:"track,artist,album,playlist", limit: 6, market:"SE" }));
    const im = a => { a = (a || []).slice().sort((x, y) => (x.width || 0) - (y.width || 0)); return ((a.find(x => (x.width || 0) >= 64) || a[0]) || {}).url || ""; };
    const out = [];
    ((j.artists || {}).items || []).slice(0, 2).forEach(x => out.push({ kind:"artist", uri: x.uri, name: x.name, sub: "Artist", img: im(x.images) }));
    ((j.tracks || {}).items || []).forEach(x => x && out.push({ kind:"track", uri: x.uri, name: x.name, sub: "Låt · " + x.artists.map(a => a.name).join(", "), img: im(x.album.images) }));
    ((j.albums || {}).items || []).slice(0, 4).forEach(x => x && out.push({ kind:"album", uri: x.uri, name: x.name, sub: "Album · " + x.artists.map(a => a.name).join(", "), img: im(x.images) }));
    ((j.playlists || {}).items || []).filter(Boolean).slice(0, 4).forEach(x => out.push({ kind:"playlist", uri: x.uri, name: x.name, sub: "Spellista", img: im(x.images) }));
    SRES = out;
  } catch(e){ SRES = []; toast("Sökningen fungerade inte"); }
  SBUSY = false; SKB = !SRES.length; if (MTAB === "sok" && VIEW === "musik") rSearch();
}
function playRes(i){ const it = (SRES || [])[i]; if (!it) return;
  if (it.kind === "artist"){ getJ("/api/sp/api?" + new URLSearchParams({ path: "search", q: 'artist:"' + it.name + '"', type: "track", limit: 1, market: "SE" })).then(j => { const t = ((j.tracks || {}).items || [])[0]; if (t) playLink(t.uri, it.name); else toast("Hittade inget"); }).catch(() => toast("Hittade inget")); return; }
  playLink(it.uri, it.name); }
function playPl(i){ const p = D.pls[i]; if (p) playLink(p.uri, p.name); }
async function loadRadio(){ try { const j = await getJ("/api/radio?top=SE"); if (Array.isArray(j)){ D.radio = j.slice(0, 24); render(); } } catch(e){} }
// TV: SVT:s kanaler och Plex-biblioteket. Kanalerna kan visas på Blaupunkt-skärmen redan nu;
// projektorn kopplas in senare (då startar den och spelar det som väljs här).
const TV = { tab: store.get("tvtab", "svt"), ch: [], secs: null, items: {}, sort: store.get("tvsort", "titleSort"), err: "", busy: false };
async function tvLoad(force){
  const now = Date.now();
  if (force || !tvLoad.at || now - tvLoad.at > 5 * 60000){ tvLoad.at = now;
    getJ("/api/tv?svt=1").then(j => { TV.ch = j.channels || []; render(); }).catch(() => {});
    getJ("/api/tv?libs=1").then(j => { TV.secs = j.sections || []; TV.err = j.error || ""; render(); }).catch(() => { TV.secs = []; }); }
  if (TV.tab !== "svt" && !TV.items[TV.tab + TV.sort]) tvMore();
}
async function tvMore(){
  const k = TV.tab + TV.sort, cur = TV.items[k] || { items: [], total: 1 };
  if (TV.busy || cur.items.length >= cur.total) return;
  TV.busy = true; render(true);
  try { const j = await getJ("/api/tv?" + new URLSearchParams({ plex: TV.tab, sort: TV.sort, start: cur.items.length }));
    if (j.error) TV.err = j.error; else TV.items[k] = { items: cur.items.concat(j.items || []), total: j.total || 0 }; } catch(e){ TV.err = "Plex svarar inte"; }
  TV.busy = false; render(true);
}
function tvTab(t){ tvTop(); TV.tab = t; store.set("tvtab", t); TV.err = ""; $("#v-tv").scrollTop = 0; tvLoad(); render(true); }
function tvSort(s){ TV.sort = s; store.set("tvsort", s); $("#v-tv").scrollTop = 0; tvLoad(); render(true); }
// Inne i TV: en sida i taget (kanal, film, serie, säsong, avsnitt) med "‹ Tillbaka" överst.
// Allt spelas på Blaupunkt-skärmen tills projektorn är inkopplad.
TV.stack = []; TV.meta = {}; TV.kids = {}; TV.scroll = [];
const curItems = () => (TV.items[TV.tab + TV.sort] || {}).items || [];
function tvOpen(page){ TV.scroll.push($("#v-tv").scrollTop); TV.stack.push(page); tvFetch(page); render(true); $("#v-tv").scrollTop = 0; }
function tvBack(){ TV.stack.pop(); render(true); $("#v-tv").scrollTop = TV.scroll.pop() || 0; }
function tvTop(){ TV.stack = []; TV.scroll = []; }
async function tvFetch(pg){
  const need = [];
  if ((pg.k === "item" || pg.k === "show") && !(TV.meta[pg.key] || {}).full) need.push(getJ("/api/tv?meta=" + pg.key).then(j => { if (j.item) TV.meta[pg.key] = Object.assign(j.item, { full: true }); else TV.err2 = j.error || "Plex svarar inte"; }));
  if ((pg.k === "show" || pg.k === "season") && !TV.kids[pg.key]) need.push(getJ("/api/tv?children=" + pg.key).then(j => { TV.kids[pg.key] = j.items || []; }));
  if (!need.length) return;
  TV.err2 = ""; await Promise.all(need).catch(() => { TV.err2 = "Plex svarar inte"; });
  if (pg.k === "show"){ const ss = TV.kids[pg.key] || []; if (ss.length && !pg.season){ pg.season = (ss.find(x => !x.seen) || ss[0]).key; tvFetch({ k: "season", key: pg.season }); } }

  else if (c === "back") kfBack();
  else if (c === "left" || c === "right"){ const el = kfCur(); if (el && el === KF && el.classList.contains("bar") && el._step) el._step(c === "right" ? 5 : -5); else kfMove(c); }
  else if (c === "up" || c === "down") kfMove(c);
  else if (c.startsWith("view:")){ go(c.slice(5)); setTimeout(() => kfSet(kfCur()), 80); }
}
// efter omritning: sätt tillbaka markören på samma knapp
new MutationObserver(() => { if (KF && !document.body.contains(KF)){ KF = null; const el = kfCur(); if (el) kfSet(el); } }).observe(document.body, { childList: true, subtree: true });
document.addEventListener("pointerdown", e => { if (e.isTrusted && KF){ KF.classList.remove("kf"); KF = null; KFkey = null; } }, true);   // fingret tar över
let CMDSINCE = 0;
async function cmdLoop(){
  for (;;){
    try {
      const j = await getJ("/api/cmd?since=" + CMDSINCE + "&wait=20");
      if (!CMDSINCE){ CMDSINCE = j.last || 1; continue; }
      for (const it of j.items || []){ if (it.id > CMDSINCE && String(it.c).startsWith("nav:")) nav(String(it.c).slice(4)); CMDSINCE = Math.max(CMDSINCE, it.id); }
      CMDSINCE = Math.max(CMDSINCE, j.last || 0);
    } catch(e){ await new Promise(r => setTimeout(r, 2000)); }
  }
}

// ---------- vila: en lugn klocka när ingen rört skärmen på två minuter ----------
let idleT = 0;
function wake(){ $("#idle").classList.remove("on"); clearTimeout(idleT); idleT = setTimeout(() => { $("#idle").classList.add("on"); paintIdle(); }, 120000); }
function paintIdle(){
  const d = new Date(), n = NOW(), na = nextAlarm();
  $("#iC").textContent = pad2(d.getHours()) + ":" + pad2(d.getMinutes());
  $("#iD").textContent = d.toLocaleDateString("sv-SE", { weekday:"long", day:"numeric", month:"long" }) + (D.wx ? " · " + Math.round(D.wx.t) + "°" : "");
  $("#iS").textContent = n.playing && n.title ? "♪ " + n.title + (n.artist ? " – " + n.artist : "") : na ? "Larm " + hhmm(na.at) : "";
  document.body.classList.toggle("night", d.getHours() >= 23 || d.getHours() < 6);
}
$("#idle").addEventListener("pointerdown", e => { e.preventDefault(); wake(); go("hem"); });
document.addEventListener("pointerdown", wake, true);
setInterval(() => { if ($("#idle").classList.contains("on")) paintIdle(); else if (VIEW === "hem") render(); }, 20000);

// ---------- hämtning ----------
async function poll(){
  try { const [st, rm] = await Promise.all([getJ("/api/tradfri-list"), getJ("/api/sonos-rooms")]); D.st = st || {}; D.rooms = rm || {}; } catch(e){}
  document.querySelector('.rb[data-v="larm"]').classList.toggle("alert", (D.st.runs || []).some(x => x.alarm));
  render();
}
async function slow(){
  try { D.deck = ((await getJ("/api/deck")) || {}).deck || {}; } catch(e){}
  try { D.S = ((await getJ("/api/state")) || {}).settings || {}; } catch(e){}
  try { D.sp = !!(await getJ("/api/sp/status")).connected; } catch(e){}
  if (D.sp){ try { const j = await getJ("/api/sp/api?path=me/playlists&limit=50");
    D.pls = (j.items || []).filter(Boolean).map(p => ({ id: p.id, uri: p.uri, name: p.name, img: ((p.images || []).slice().sort((a, b) => (a.width || 0) - (b.width || 0)).find(x => (x.width || 0) >= 200) || (p.images || [])[0] || {}).url || "" })); } catch(e){} }
  const e = Object.assign({ lat:60.6065, lon:15.6355 }, D.S.edge || {});
  try { const j = await getJ(`https://api.open-meteo.com/v1/forecast?latitude=${e.lat}&longitude=${e.lon}&current=temperature_2m,weather_code,is_day&daily=temperature_2m_max,temperature_2m_min&timezone=auto&forecast_days=1`);
    D.wx = { t: j.current.temperature_2m, c: j.current.weather_code, day: j.current.is_day === 1, hi: j.daily.temperature_2m_max[0], lo: j.daily.temperature_2m_min[0] }; } catch(err){}
  render();
}
(async () => {
  go("hem"); wake();
  await Promise.all([slow(), poll()]);
  send("sonos-focus:" + room());
  setInterval(poll, 2000);
  cmdLoop();
  setInterval(slow, 5 * 60000);
  setInterval(() => send("sonos-focus:" + room()), 30000);
  setInterval(() => location.reload(), 6 * 3600 * 1000);      // ny version av sidan då och då
})();
</script>
